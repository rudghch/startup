<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>길찾기</title>

  <!-- 카카오맵 불러오기 (appkey는 카카오에서 받은 JavaScript 키, services는 장소 검색 도구) -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=16a7c42cb5992296881e99c8be99f7c1&libraries=services"></script>

  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
      color: #1f2430;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: #2f6bff;
      color: #ffffff;
    }
    header h1 { margin: 0; font-size: 22px; }
    header a { color: #ffffff; font-size: 14px; }
    /* 이름을 누르면 처음 화면으로 돌아가요 */
    header h1 a { color: inherit; font-size: inherit; text-decoration: none; }
    /* 만든 사람 이름 */
    .makers { margin-left: 10px; font-size: 13px; font-weight: normal; opacity: 0.9; }

    /* 출발·도착을 정하는 곳 */
    .panel { padding: 10px 16px; background: #f4f6fb; border-bottom: 1px solid #dfe4ee; }
    .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .tag {
      flex: none;
      width: 48px;
      padding: 6px 0;
      border-radius: 8px;
      color: #ffffff;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
    }
    .tag.start { background: #1e9e55; }
    .tag.end { background: #e0392b; }
    .row input {
      flex: 1;
      min-width: 0;
      padding: 9px 12px;
      font-size: 15px;
      font-family: inherit;
      border: 1px solid #c9d0dd;
      border-radius: 8px;
    }
    button {
      flex: none;
      padding: 9px 12px;
      font-size: 14px;
      font-family: inherit;
      border: 1px solid #c9d0dd;
      border-radius: 8px;
      background: #ffffff;
      color: #1f2430;
      cursor: pointer;
    }
    button:hover { background: #eef2fb; }
    button.on { background: #2f6bff; border-color: #2f6bff; color: #ffffff; }

    /* 검색 결과 목록 */
    #results {
      margin: 0 0 8px;
      padding: 0;
      list-style: none;
      max-height: 170px;
      overflow-y: auto;
      background: #ffffff;
      border: 1px solid #c9d0dd;
      border-radius: 8px;
    }
    #results button {
      display: block;
      width: 100%;
      border: none;
      border-bottom: 1px solid #eef0f5;
      border-radius: 0;
      text-align: left;
    }
    #results small { color: #6b7385; margin-left: 6px; }
    #info { margin: 0; font-size: 15px; color: #3d4658; }

    /* 이동 방법 고르는 버튼들 */
    .ways { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    /* 대중교통으로 가는 순서 */
    #steps {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 72px;
      margin: 6px 0 0;
      padding: 0;
      overflow-y: auto;
      list-style: none;
      counter-reset: step;
    }
    #steps li {
      padding: 4px 10px;
      background: #ffffff;
      border: 1px solid #dfe4ee;
      border-radius: 14px;
      font-size: 13px;
      counter-increment: step;
    }
    #steps li::before { content: counter(step) ". "; color: #6b7385; }
    .transit-link {
      display: inline-block;
      margin-top: 6px;
      padding: 8px 12px;
      border-radius: 8px;
      background: #8e44ad;
      color: #ffffff;
      font-size: 14px;
      font-weight: bold;
      text-decoration: none;
    }

    /* 출발·도착하는 곳의 날씨 */
    .weather { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .weather-card {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 92px;
      padding: 8px 12px;
      background: #ffffff;
      border: 1px solid #dfe4ee;
      border-radius: 10px;
      font-size: 14px;
    }
    .weather-card .emoji { font-size: 38px; line-height: 1; }
    .weather-card .now { flex: none; }
    .weather-card .where { font-weight: bold; }
    .weather-card .where.start { color: #1e9e55; }
    .weather-card .where.end { color: #e0392b; }
    .weather-card .temp { font-size: 18px; font-weight: bold; }
    .weather-card .humidity { color: #3d4658; }
    .weather-card .rain { flex: 1; min-width: 0; }
    .weather-card .rain-chance { font-weight: bold; color: #1d5fd6; }
    .weather-card .rain-amount { color: #5b6272; font-size: 12px; }

    /* 비 올 확률 막대그래프 */
    .bars { display: flex; align-items: flex-end; gap: 2px; height: 36px; margin-top: 4px; border-bottom: 1px solid #c9d0dd; }
    .bars div { flex: 1; min-height: 2px; background: #4a90e2; border-radius: 2px 2px 0 0; }
    .bar-times { display: flex; justify-content: space-between; font-size: 11px; color: #6b7385; }

    /* 지도와 로드뷰 */
    /* 화면이 낮아도 지도가 360px보다 작아지지 않아요 (대신 화면을 아래로 내려서 봐요) */
    .views { flex: 1 0 360px; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
    .map-box { position: relative; min-height: 0; }
    #map { width: 100%; height: 100%; }
    #resetViewButton {
      position: absolute;
      left: 10px;
      top: 10px;
      z-index: 5;
      font-weight: bold;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.3);
    }
    .roadview-box { position: relative; min-height: 0; border-left: 2px solid #ffffff; background: #20242e; }
    #roadview { width: 100%; height: 100%; }
    #roadviewMessage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: #20242e;
      color: #d5dbe6;
      font-size: 16px;
      text-align: center;
      line-height: 1.6;
    }
    .roadview-controls {
      position: absolute;
      left: 10px;
      bottom: 10px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #progress { padding: 6px 10px; border-radius: 8px; background: rgba(0, 0, 0, 0.6); color: #ffffff; font-size: 13px; }

    /* 지도 위의 출발·도착 이름표 */
    .pin-label {
      padding: 3px 8px;
      border-radius: 10px;
      color: #ffffff;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
    }
    .pin-label.start { background: #1e9e55; }
    .pin-label.end { background: #e0392b; }

    /* 지금 로드뷰로 보고 있는 곳 */
    .walker {
      width: 20px;
      height: 20px;
      border: 3px solid #ffffff;
      border-radius: 50%;
      background: #ff8a00;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.5);
    }

    .map-error { padding: 40px 16px; text-align: center; color: #5b6272; font-size: 17px; line-height: 1.6; }

    /* 화면이 좁으면 지도와 로드뷰를 위아래로 */
    @media (max-width: 800px) {
      .views { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
      .roadview-box { border-left: none; border-top: 2px solid #ffffff; }
    }
  </style>
</head>
<body>
  <header>
    <h1><a href="../" title="처음 화면으로">🗺️ 길찾기</a> <small class="makers">만든 사람: 김건하, 임유빈, 전효성</small></h1>
    <a href="../">처음 화면으로</a>
  </header>

  <!-- 출발·도착을 정하는 곳 -->
  <div class="panel" id="panel">
    <form class="row" id="startForm">
      <span class="tag start">출발</span>
      <input type="text" id="startInput" placeholder="출발할 곳 (예: 경호초등학교)" autocomplete="off" aria-label="출발할 곳">
      <button type="submit">검색</button>
      <button type="button" id="startPick">지도에서 찍기</button>
    </form>
    <form class="row" id="endForm">
      <span class="tag end">도착</span>
      <input type="text" id="endInput" placeholder="도착할 곳 (예: 여수엑스포역)" autocomplete="off" aria-label="도착할 곳">
      <button type="submit">검색</button>
      <button type="button" id="endPick">지도에서 찍기</button>
    </form>
    <ul id="results" hidden></ul>

    <!-- 이동 방법 고르기 -->
    <div class="ways" id="ways">
      <button type="button" data-way="transit">🚌🚇 대중교통</button>
      <button type="button" data-way="walk">🚶 도보</button>
      <button type="button" data-way="bike">🚲 자전거</button>
      <button type="button" data-way="car" class="on">🚗 승용차</button>
    </div>

    <!-- 대중교통을 골랐을 때만 보이는 종류 고르기 -->
    <div class="ways" id="transitKinds" hidden>
      <button type="button" data-kind="ALL" class="on">추천</button>
      <button type="button" data-kind="BUS">🚌 버스</button>
      <button type="button" data-kind="SUBWAY">🚇 지하철</button>
    </div>

    <!-- 대중교통으로 가는 여러 길 중에서 고르기 -->
    <div class="ways" id="routeChoices" hidden></div>

    <p id="info">출발할 곳과 도착할 곳을 검색하거나 지도에서 찍어 보세요.</p>
    <!-- 대중교통으로 가는 순서 -->
    <ol id="steps" hidden></ol>
    <a id="transitLink" class="transit-link" target="_blank" rel="noopener" hidden>🚌🚇 카카오맵에서 버스·지하철 길 보기 (새 창)</a>

    <!-- 출발·도착하는 곳의 날씨가 나오는 자리 -->
    <div class="weather">
      <div class="weather-card" id="startWeather" hidden></div>
      <div class="weather-card" id="endWeather" hidden></div>
    </div>
  </div>

  <div class="views" id="views">
    <!-- 지도가 그려지는 자리 -->
    <div class="map-box">
      <div id="map"></div>
      <!-- 지도를 움직이거나 확대·축소한 뒤, 길 전체가 보이는 처음 모습으로 돌아가는 버튼 -->
      <button type="button" id="resetViewButton" hidden>↺ 경로 한눈에 보기</button>
    </div>

    <!-- 로드뷰(길거리 사진)가 나오는 자리 -->
    <div class="roadview-box">
      <div id="roadview"></div>
      <div id="roadviewMessage">출발과 도착을 정하면<br>가는 길을 로드뷰로 보여 줘요.</div>
      <div class="roadview-controls" id="roadviewControls" hidden>
        <button type="button" id="playButton">일시정지</button>
        <button type="button" id="restartButton">처음부터</button>
        <span id="progress"></span>
      </div>
    </div>
  </div>

  <script>
    if (!(window.kakao && kakao.maps)) {
      // 카카오맵은 올린 사이트(rudghch.github.io)에서만 보여요
      document.getElementById("panel").hidden = true;
      const views = document.getElementById("views");
      views.className = "map-error";
      views.textContent = "지도를 불러오지 못했어요. 카카오맵은 웹에 올린 사이트에서만 보여요.";
    } else {
      startApp();
    }

    function startApp() {
      // ---------- 바꿔 볼 수 있는 숫자들 ----------
      // 지도가 처음 보여 줄 곳 (여수 경호초등학교): (위도, 경도)
      const firstPlace = new kakao.maps.LatLng(34.72003, 127.72419);
      // 대중교통·도보·자전거 길을 카카오에 대신 물어봐 주는 우리 서버 주소 (비어 있으면 쓰지 않아요)
      const ROUTE_URL = "https://w4ig7pmgrpxw5uu4qn3datduw40fyxxc.lambda-url.ap-northeast-2.on.aws/";
      // 로드뷰 한 장을 보여 주는 시간 (1000 = 1초)
      const STEP_TIME = 2000;
      // 로드뷰를 몇 미터마다 볼지 (길이 길면 자동으로 더 띄엄띄엄 봐요)
      const STEP_METERS = 30;
      // 로드뷰를 최대 몇 장까지 볼지
      const MAX_STEPS = 150;

      const info = document.getElementById("info");
      const results = document.getElementById("results");
      const roadviewMessage = document.getElementById("roadviewMessage");
      const roadviewControls = document.getElementById("roadviewControls");
      const playButton = document.getElementById("playButton");
      const restartButton = document.getElementById("restartButton");
      const progress = document.getElementById("progress");

      // 출발("start")과 도착("end")에 쓰는 화면 조각들
      const inputs = { start: document.getElementById("startInput"), end: document.getElementById("endInput") };
      const forms = { start: document.getElementById("startForm"), end: document.getElementById("endForm") };
      const pickButtons = { start: document.getElementById("startPick"), end: document.getElementById("endPick") };
      const words = { start: "출발", end: "도착" };

      // ---------- 지도 만들기 ----------
      const map = new kakao.maps.Map(document.getElementById("map"), { center: firstPlace, level: 3 });
      map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);

      const places = new kakao.maps.services.Places();      // 장소 검색
      const geocoder = new kakao.maps.services.Geocoder();  // 좌표를 주소로 바꾸기

      // ---------- 로드뷰 만들기 ----------
      const roadview = new kakao.maps.Roadview(document.getElementById("roadview"));
      const roadviewClient = new kakao.maps.RoadviewClient();

      // 지금 로드뷰로 보고 있는 곳을 지도에 표시하는 주황색 동그라미
      const walkerDot = document.createElement("div");
      walkerDot.className = "walker";
      const walker = new kakao.maps.CustomOverlay({ content: walkerDot, zIndex: 10 });

      // 정해진 출발·도착: { position: 좌표, name: 이름 }
      const points = { start: null, end: null };
      const pins = { start: null, end: null };
      const labels = { start: null, end: null };

      // 이동 방법들: 길찾기 서버 이름, 선 색, 안내하는 말 (kakao가 true면 카카오에 먼저 물어봐요)
      const ways = {
        transit: { emoji: "🚌", color: "#8e44ad" },
        walk: { emoji: "🚶", color: "#1e9e55", server: "routed-foot", how: "걸어서", kakao: true },
        bike: { emoji: "🚲", color: "#00a3a3", server: "routed-bike", how: "자전거로", kakao: true },
        car: { emoji: "🚗", color: "#2f6bff", server: "routed-car", how: "승용차로" }
      };
      let mode = "car";          // 지금 고른 이동 방법
      let transitKind = "ALL";   // 대중교통 종류: "ALL"(전체), "BUS"(버스), "SUBWAY"(지하철)

      // 대중교통 길의 조각마다 쓰는 색과 이모티콘
      const stepColors = { BUS: "#2f6bff", SUBWAY: "#8e44ad", WALKING: "#6b7385" };
      const stepEmojis = { BUS: "🚌", SUBWAY: "🚇", WALKING: "🚶" };

      const transitLink = document.getElementById("transitLink");
      const transitKinds = document.getElementById("transitKinds");
      const stepsBox = document.getElementById("steps");
      const routeChoices = document.getElementById("routeChoices");
      let transitChoice = 0;     // 대중교통의 여러 길 중 몇 번째를 골랐는지 (0이 첫 번째)

      let pickMode = null;   // 지도에서 찍는 중이면 "start" 또는 "end"
      let routeLines = [];   // 지도에 그린 길 (대중교통은 여러 조각)
      let routePath = [];    // 길 위의 좌표를 처음부터 끝까지 이은 것
      let routeId = 0;       // 길을 새로 찾을 때마다 1씩 커져요

      // ---------- 출발·도착 정하기 ----------
      function setPoint(which, position, name) {
        points[which] = { position: position, name: name };
        transitChoice = 0;
        inputs[which].value = name;

        // 전에 꽂은 핀과 이름표 지우기
        if (pins[which]) pins[which].setMap(null);
        if (labels[which]) labels[which].setMap(null);

        pins[which] = new kakao.maps.Marker({ position: position, map: map });

        const label = document.createElement("div");
        label.className = "pin-label " + which;
        label.textContent = words[which];
        labels[which] = new kakao.maps.CustomOverlay({ position: position, content: label, yAnchor: 2.9, map: map });

        showWeather(which, position);

        if (points.start && points.end) {
          findRoute();
        } else {
          map.panTo(position);
          info.textContent = which === "start" ? "이제 도착할 곳을 정해 주세요." : "이제 출발할 곳을 정해 주세요.";
        }
      }

      // 검색하기
      function search(which) {
        const text = inputs[which].value.trim();
        if (text === "") return;

        places.keywordSearch(text, function (data, status) {
          results.innerHTML = "";

          if (status !== kakao.maps.services.Status.OK) {
            results.hidden = true;
            info.textContent = '"' + text + '"을(를) 찾지 못했어요. 다른 이름으로 검색해 보세요.';
            return;
          }

          // 찾은 곳을 5개까지 목록으로 보여 주기
          data.slice(0, 5).forEach(function (place) {
            const item = document.createElement("li");
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = place.place_name;

            const address = document.createElement("small");
            address.textContent = place.road_address_name || place.address_name;
            button.appendChild(address);

            button.addEventListener("click", function () {
              results.hidden = true;
              setPoint(which, new kakao.maps.LatLng(place.y, place.x), place.place_name);
            });
            item.appendChild(button);
            results.appendChild(item);
          });
          results.hidden = false;
          info.textContent = words[which] + "할 곳을 목록에서 골라 주세요.";
        });
      }

      // 지도에서 찍기 켜고 끄기
      function setPickMode(which) {
        pickMode = which;
        pickButtons.start.classList.toggle("on", which === "start");
        pickButtons.end.classList.toggle("on", which === "end");
        map.setCursor(which ? "crosshair" : "");
        if (which) {
          results.hidden = true;
          info.textContent = "지도에서 " + words[which] + "할 곳을 눌러 주세요.";
        }
      }

      ["start", "end"].forEach(function (which) {
        forms[which].addEventListener("submit", function (event) {
          event.preventDefault();
          setPickMode(null);
          search(which);
        });
        pickButtons[which].addEventListener("click", function () {
          setPickMode(pickMode === which ? null : which);
        });
      });

      // 지도를 누르면 그곳을 출발 또는 도착으로 정하기
      kakao.maps.event.addListener(map, "click", function (mouseEvent) {
        if (!pickMode) return;

        const which = pickMode;
        const position = mouseEvent.latLng;
        setPickMode(null);

        // 누른 곳의 주소 알아내기
        geocoder.coord2Address(position.getLng(), position.getLat(), function (result, status) {
          let name = "지도에서 고른 곳";
          if (status === kakao.maps.services.Status.OK && result[0]) {
            name = result[0].road_address ? result[0].road_address.address_name : result[0].address.address_name;
          }
          setPoint(which, position, name);
        });
      });

      // ---------- 날씨 보여 주기 ----------
      const weatherCards = { start: document.getElementById("startWeather"), end: document.getElementById("endWeather") };
      const weatherIds = { start: 0, end: 0 };

      // 날씨 번호를 이모티콘과 말로 바꾸기 (isDay가 0이면 밤)
      function weatherLook(code, isDay) {
        if (code === 0) return isDay ? ["☀️", "맑음"] : ["🌙", "맑음"];
        if (code === 1) return isDay ? ["🌤️", "대체로 맑음"] : ["🌙", "대체로 맑음"];
        if (code === 2) return ["⛅", "구름 조금"];
        if (code === 3) return ["☁️", "흐림"];
        if (code === 45 || code === 48) return ["🌫️", "안개"];
        if (code >= 51 && code <= 57) return ["🌦️", "이슬비"];
        if (code >= 61 && code <= 67) return ["🌧️", "비"];
        if (code >= 71 && code <= 77) return ["❄️", "눈"];
        if (code >= 80 && code <= 82) return ["🌧️", "소나기"];
        if (code === 85 || code === 86) return ["🌨️", "눈"];
        if (code >= 95) return ["⛈️", "천둥번개"];
        return ["🌡️", "알 수 없음"];
      }

      // 글자가 들어간 조각 하나 만들기
      function piece(tag, className, text) {
        const element = document.createElement(tag);
        element.className = className;
        element.textContent = text;
        return element;
      }

      async function showWeather(which, position) {
        weatherIds[which] += 1;
        const myId = weatherIds[which];
        const card = weatherCards[which];
        card.hidden = false;
        card.textContent = words[which] + " 날씨를 알아보는 중이에요...";

        // 날씨 칸이 생기면서 지도 크기가 바뀌었으니 다시 맞춰요
        map.relayout();
        roadview.relayout();

        let data;
        try {
          // 무료 날씨 서버(Open-Meteo)에 지금 날씨와 앞으로 12시간 비 소식을 물어봐요
          const url = "https://api.open-meteo.com/v1/forecast"
            + "?latitude=" + position.getLat() + "&longitude=" + position.getLng()
            + "&current=temperature_2m,relative_humidity_2m,weather_code,is_day"
            + "&hourly=precipitation_probability,precipitation"
            + "&forecast_hours=12&timezone=Asia%2FSeoul";
          const response = await fetch(url);
          data = await response.json();
          if (!data.current || !data.hourly) throw new Error("날씨 없음");
        } catch (error) {
          if (myId === weatherIds[which]) card.textContent = words[which] + " 날씨를 가져오지 못했어요.";
          return;
        }
        if (myId !== weatherIds[which]) return; // 그 사이에 다른 곳으로 바꿨으면 그만둬요

        const look = weatherLook(data.current.weather_code, data.current.is_day);
        const chances = data.hourly.precipitation_probability.map(function (c) { return c || 0; });
        const amounts = data.hourly.precipitation.map(function (a) { return a || 0; });
        const hours = data.hourly.time.map(function (t) { return Number(t.slice(11, 13)) + "시"; });
        const total = amounts.reduce(function (sum, a) { return sum + a; }, 0);

        card.textContent = "";
        card.appendChild(piece("div", "emoji", look[0]));

        // 지금 날씨: 날씨, 온도, 습도
        const now = piece("div", "now", "");
        now.appendChild(piece("div", "where " + which, words[which] + " · " + look[1]));
        now.appendChild(piece("div", "temp", Math.round(data.current.temperature_2m) + "°C"));
        now.appendChild(piece("div", "humidity", "💧 습도 " + Math.round(data.current.relative_humidity_2m) + "%"));
        card.appendChild(now);

        // 비 소식: 비 올 확률, 예상 강수량, 막대그래프
        const rain = piece("div", "rain", "");
        rain.appendChild(piece("span", "rain-chance", "☔ 비 올 확률 " + chances[0] + "% "));
        rain.appendChild(piece("span", "rain-amount", "12시간 강수량 " + total.toFixed(1) + "mm"));

        const bars = piece("div", "bars", "");
        bars.setAttribute("role", "img");
        bars.setAttribute("aria-label", "앞으로 12시간 비 올 확률 그래프, 가장 높을 때 " + Math.max.apply(null, chances) + "%");
        chances.forEach(function (chance, i) {
          const bar = document.createElement("div");
          bar.style.height = chance + "%";
          bar.title = hours[i] + " · 비 올 확률 " + chance + "% · " + amounts[i].toFixed(1) + "mm";
          bars.appendChild(bar);
        });
        rain.appendChild(bars);

        const times = piece("div", "bar-times", "");
        times.appendChild(piece("span", "", hours[0]));
        times.appendChild(piece("span", "", hours[Math.floor(hours.length / 2)]));
        times.appendChild(piece("span", "", hours[hours.length - 1]));
        rain.appendChild(times);
        card.appendChild(rain);
      }

      // ---------- 길 찾기 ----------
      // [경도, 위도] 숫자 쌍들을 카카오 좌표로 바꾸기
      function toPositions(pairs) {
        return pairs.map(function (c) { return new kakao.maps.LatLng(c[1], c[0]); });
      }

      // 우리 서버를 거쳐 카카오에 길을 물어보기 (kind: "transit", "walk", "bike")
      // from, to를 주지 않으면 출발하는 곳에서 도착하는 곳까지 물어봐요
      async function askKakao(kind, from, to) {
        const start = from || points.start.position;
        const end = to || points.end.position;
        const response = await fetch(ROUTE_URL, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            mode: kind,
            start_x: start.getLng(), start_y: start.getLat(),
            end_x: end.getLng(), end_y: end.getLat()
          })
        });
        const data = await response.json();
        if (!response.ok || data.status !== "OK") throw new Error(data.error || data.status || "길 없음");
        return data;
      }

      // 카카오가 알려 준 도보·자전거 길에서 좌표, 거리, 시간만 꺼내기
      function readKakaoRoute(data) {
        const pairs = [];
        data.route.legs.forEach(function (leg) {
          leg.steps.forEach(function (step) {
            step.path.points.forEach(function (c) { pairs.push(c); });
          });
        });
        if (pairs.length < 2) throw new Error("길 없음");
        return { points: toPositions(pairs), distance: data.route.properties.totalDistance, duration: data.route.properties.totalTime };
      }

      // 대중교통을 타러 가거나 내려서 걷는 길 한 조각 만들기 (30m보다 가까우면 만들지 않아요)
      async function walkPiece(from, to, text) {
        if (meters(from, to) < 30) return null;
        let walk;
        try {
          walk = readKakaoRoute(await askKakao("walk", from, to));
        } catch (error) {
          // 걷는 길을 못 받으면 곧은 선으로 잇고, 1초에 1.1m 걷는다고 어림해요
          walk = { points: [from, to], duration: meters(from, to) / 1.1 };
        }
        return { type: "WALKING", points: walk.points, text: "🚶 " + text + " (" + timeText(walk.duration) + ")" };
      }

      // 대중교통 길은 한 번 받아 두고, 버스/지하철만 바꿔 볼 때는 다시 묻지 않아요
      let transitSaved = { key: "", data: null };
      async function askTransit() {
        const key = points.start.position.toString() + points.end.position.toString();
        if (transitSaved.key !== key) transitSaved = { key: key, data: await askKakao("transit") };
        return transitSaved.data;
      }

      // 무료 길찾기 서버(OSRM)에 길을 물어보기
      async function askOsrm(server) {
        const start = points.start.position;
        const end = points.end.position;
        const url = "https://routing.openstreetmap.de/" + server + "/route/v1/driving/"
          + start.getLng() + "," + start.getLat() + ";" + end.getLng() + "," + end.getLat()
          + "?overview=full&geometries=geojson";
        const response = await fetch(url);
        const data = await response.json();
        const route = data.routes[0];
        return { points: toPositions(route.geometry.coordinates), distance: route.distance, duration: route.duration };
      }

      // 지도에 길 그리기. 조각 하나: { points: 좌표들, color: 색, dashed: 점선인지 }
      function drawRoute(pieces) {
        routeLines.forEach(function (line) { line.setMap(null); });
        routePath = [];
        routeLines = pieces.map(function (piece) {
          piece.points.forEach(function (position) { routePath.push(position); });
          return new kakao.maps.Polyline({
            path: piece.points,
            strokeWeight: 6,
            strokeColor: piece.color,
            strokeOpacity: 0.9,
            strokeStyle: piece.dashed ? "shortdash" : "solid",
            map: map
          });
        });
        showWholeRoute();
      }

      // 대중교통으로 가는 여러 길을 버튼으로 보여 주기. 누르면 그 길로 바꿔요
      function showChoices(choices) {
        routeChoices.innerHTML = "";
        choices.forEach(function (text, i) {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = (i + 1) + "번 길 · " + text;
          button.classList.toggle("on", i === transitChoice);
          button.addEventListener("click", function () {
            transitChoice = i;
            findRoute();
          });
          routeChoices.appendChild(button);
        });
        routeChoices.hidden = choices.length < 2;
      }

      // 가는 순서를 차례대로 보여 주기 (대중교통에서 써요)
      function showSteps(steps) {
        stepsBox.innerHTML = "";
        steps.forEach(function (text) {
          const item = document.createElement("li");
          item.textContent = text;
          stepsBox.appendChild(item);
        });
        stepsBox.hidden = steps.length === 0;
      }

      async function findRoute() {
        routeId += 1;
        const myId = routeId;
        stopTour();
        info.textContent = "길을 찾는 중이에요...";

        const start = points.start.position;
        const end = points.end.position;
        const way = ways[mode];

        // 길을 못 찾았을 때 쓰는 곧은 점선
        let pieces = [{ points: [start, end], color: way.color, dashed: true }];
        let text = "길을 찾지 못해서 곧은 선으로 이었어요. 직선 거리 약 " + distanceText(meters(start, end));
        let steps = [];
        let choices = [];   // 대중교통에서 고를 수 있는 길들의 이름표
        let found = false;

        transitLink.hidden = true;

        if (mode === "transit") {
          // 카카오맵에서 크게 보는 버튼은 언제나 보여 줘요
          transitLink.href = "https://map.kakao.com/link/by/traffic/"
            + linkPlace(points.start) + "/" + linkPlace(points.end);
          transitLink.hidden = false;
          text = "🚌🚇 버스·지하철 길을 가져오지 못했어요. 아래 버튼을 눌러 카카오맵에서 볼 수 있어요.";

          if (ROUTE_URL) {
            try {
              const data = await askTransit();

              // 고른 종류(전체/버스/지하철)에 맞는 길만 남기기
              const routes = data.routes.filter(function (route) {
                const type = route.properties.type;
                if (transitKind === "BUS") return type === "BUS";
                if (transitKind === "SUBWAY") return type === "SUBWAY" || type === "BUS_AND_SUBWAY";
                return true;
              });

              if (routes.length === 0) {
                text = transitKind === "SUBWAY"
                  ? "🚇 이 길에는 지하철로 가는 방법이 없어요. 다른 종류를 골라 보세요."
                  : "🚌 이 길에는 버스만 타고 가는 방법이 없어요. 다른 종류를 골라 보세요.";
              } else {
                // 고를 수 있는 길을 5개까지 버튼으로 만들 준비 (무엇을 타는지, 시간, 요금)
                choices = routes.slice(0, 5).map(function (candidate) {
                  const rides = candidate.steps.filter(function (step) {
                    return step.properties.type !== "WALKING";
                  }).map(function (step) {
                    const vehicle = step.properties.vehicles && step.properties.vehicles[0];
                    return stepEmojis[step.properties.type] + " " + (vehicle ? vehicle.name : step.properties.guidance.split(" (")[0]);
                  });
                  const fare = candidate.properties.fare;
                  return rides.join(" → ") + " · " + timeText(candidate.properties.totalTime)
                    + (fare && fare.value ? " · " + fare.value.toLocaleString() + "원" : "");
                });

                // 고른 길을 보여 줘요 (처음에는 맨 앞의 추천 길)
                if (transitChoice >= choices.length) transitChoice = 0;
                const route = routes[transitChoice];
                let parts = [];
                route.steps.forEach(function (step) {
                  const type = step.properties.type;
                  parts.push({
                    type: type,
                    points: step.path && step.path.points ? toPositions(step.path.points) : [],
                    text: stepEmojis[type] + " " + step.properties.guidance + " (" + timeText(step.properties.time) + ")",
                    firstStop: step.properties.stops && step.properties.stops[0] ? step.properties.stops[0].name : ""
                  });
                });

                // 카카오는 처음 타는 곳까지, 마지막에 내려서 걷는 길을 알려 주지 않아서 따로 물어봐요
                const ridden = parts.filter(function (part) { return part.points.length > 1; });
                if (ridden.length > 0) {
                  const first = ridden[0];
                  const last = ridden[ridden.length - 1];
                  const walks = await Promise.all([
                    walkPiece(start, first.points[0], (first.firstStop || "타는 곳") + "까지 걷기"),
                    walkPiece(last.points[last.points.length - 1], end, "도착하는 곳까지 걷기")
                  ]);
                  if (walks[0]) parts.unshift(walks[0]);
                  if (walks[1]) parts.push(walks[1]);
                }

                const drawn = [];
                parts.forEach(function (part) {
                  steps.push(part.text);
                  if (part.points.length > 1) {
                    drawn.push({ points: part.points, color: stepColors[part.type], dashed: part.type === "WALKING" });
                  }
                });
                if (drawn.length > 0) pieces = drawn;

                const p = route.properties;
                text = "🚌🚇 약 " + timeText(p.totalTime) + " · 거리 약 " + distanceText(p.totalDistance)
                  + " · 갈아타기 " + p.transfers + "번"
                  + (p.fare && p.fare.value ? " · 요금 약 " + p.fare.value.toLocaleString() + "원" : "");
                found = true;
              }
            } catch (error) {
              // 서버가 대답하지 않으면 위의 안내 글과 곧은 점선을 그대로 써요
            }
          }
        } else {
          let got = null;

          // 도보와 자전거는 카카오에 먼저 물어보고, 안 되면 무료 길찾기 서버에 물어봐요
          if (ROUTE_URL && way.kakao) {
            try {
              got = readKakaoRoute(await askKakao(mode));
            } catch (error) {
              got = null;
            }
          }
          if (!got) {
            try {
              got = await askOsrm(way.server);
            } catch (error) {
              got = null;
            }
          }

          if (got) {
            pieces = [{ points: got.points, color: way.color, dashed: false }];
            text = way.emoji + " 거리 약 " + distanceText(got.distance) + " · " + way.how + " 약 " + timeText(got.duration);
            found = true;
          }
        }

        if (myId !== routeId) return; // 그 사이에 다른 길을 찾기 시작했으면 그만둬요

        info.textContent = points.start.name + " → " + points.end.name + " · " + text;
        transitKinds.hidden = mode !== "transit";
        showChoices(choices);
        showSteps(steps);

        // 안내 칸 높이가 바뀌었으니 지도 크기를 다시 맞춘 뒤에 길을 그려요
        map.relayout();
        roadview.relayout();
        drawRoute(pieces);

        if (found) {
          startTour(routePath.slice());
        } else {
          roadviewMessage.innerHTML = "길을 찾으면<br>가는 길을 로드뷰로 보여 줘요.";
          roadviewMessage.hidden = false;
          roadviewControls.hidden = true;
        }
      }

      // 카카오맵 링크에 넣을 "이름,위도,경도" 만들기
      function linkPlace(point) {
        const name = point.name.replace(/[,\/]/g, " ");
        return encodeURIComponent(name) + "," + point.position.getLat() + "," + point.position.getLng();
      }

      // 버튼 묶음에서 누른 버튼만 켜진 모양으로 바꾸기
      function turnOn(button) {
        Array.from(button.parentElement.querySelectorAll("button")).forEach(function (other) {
          other.classList.toggle("on", other === button);
        });
      }

      // 이동 방법 버튼을 누르면 그 방법으로 길을 다시 찾기
      Array.from(document.querySelectorAll("#ways button")).forEach(function (button) {
        button.addEventListener("click", function () {
          mode = button.dataset.way;
          turnOn(button);
          if (points.start && points.end) findRoute();
        });
      });

      // 대중교통 종류(전체/버스/지하철) 버튼
      Array.from(document.querySelectorAll("#transitKinds button")).forEach(function (button) {
        button.addEventListener("click", function () {
          transitKind = button.dataset.kind;
          transitChoice = 0;
          turnOn(button);
          if (points.start && points.end) findRoute();
        });
      });

      // 길 전체가 한눈에 보이게 지도를 축소하기
      function showWholeRoute() {
        if (routePath.length === 0) return;
        const bounds = new kakao.maps.LatLngBounds();
        routePath.forEach(function (position) { bounds.extend(position); });
        map.setBounds(bounds, 70, 70, 70, 70);
        resetViewButton.hidden = false;
      }

      // "경로 한눈에 보기" 버튼: 길이 그려지면 나타나고, 누르면 처음 모습으로 돌아가요
      const resetViewButton = document.getElementById("resetViewButton");
      resetViewButton.addEventListener("click", showWholeRoute);

      // 창 크기가 바뀌면 지도와 로드뷰를 다시 맞추기
      window.addEventListener("resize", function () {
        map.relayout();
        roadview.relayout();
        showWholeRoute();
      });

      // ---------- 로드뷰 자동으로 보기 ----------
      const tour = { stops: [], index: 0, shown: 0, playing: false, id: 0, timer: null, lastPano: null, pan: 0 };

      // 로드뷰 사진이 준비되면 가는 방향을 바라보게 하기
      kakao.maps.event.addListener(roadview, "init", function () {
        roadview.setViewpoint({ pan: tour.pan, tilt: 0, zoom: 0 });
      });

      function startTour(path) {
        stopTour();
        tour.stops = makeStops(path);
        tour.index = 0;
        tour.shown = 0;
        tour.lastPano = null;
        tour.playing = true;

        roadviewMessage.innerHTML = "로드뷰를 찾는 중이에요...";
        roadviewMessage.hidden = false;
        roadviewControls.hidden = false;
        playButton.textContent = "일시정지";
        showNextStop();
      }

      function stopTour() {
        tour.id += 1;
        tour.playing = false;
        clearTimeout(tour.timer);
        walker.setMap(null);
      }

      function showNextStop() {
        if (!tour.playing) return;

        // 끝까지 다 봤을 때
        if (tour.index >= tour.stops.length) {
          tour.playing = false;
          playButton.textContent = "다시 보기";
          if (tour.shown === 0) {
            roadviewMessage.innerHTML = "이 길에는 로드뷰 사진이 없어요.<br>큰길이 있는 곳으로 다시 정해 보세요.";
            roadviewMessage.hidden = false;
            roadviewControls.hidden = true;
          } else {
            progress.textContent = "도착했어요!";
          }
          return;
        }

        const myId = tour.id;
        const index = tour.index;
        const position = tour.stops[index];

        // 이 자리에서 가장 가까운 로드뷰 사진 찾기 (50m 안에서)
        roadviewClient.getNearestPanoId(position, 50, function (panoId) {
          if (myId !== tour.id || !tour.playing) return;
          tour.index = index + 1;

          // 사진이 없거나 방금 본 사진이면 다음 자리로 넘어가요
          if (panoId === null || panoId === tour.lastPano) {
            showNextStop();
            return;
          }

          tour.lastPano = panoId;
          tour.shown += 1;
          tour.pan = direction(position, tour.stops[index + 1] || position);

          roadviewMessage.hidden = true;
          roadview.setPanoId(panoId, position);
          walker.setPosition(position);
          walker.setMap(map);
          progress.textContent = "가는 중 " + Math.round((tour.index / tour.stops.length) * 100) + "%";

          tour.timer = setTimeout(showNextStop, STEP_TIME);
        });
      }

      playButton.addEventListener("click", function () {
        if (tour.playing) {
          // 일시정지
          tour.playing = false;
          clearTimeout(tour.timer);
          playButton.textContent = "이어 보기";
        } else {
          // 이어 보기 (끝까지 봤으면 처음부터)
          if (tour.index >= tour.stops.length) {
            tour.index = 0;
            tour.shown = 0;
            tour.lastPano = null;
          }
          tour.playing = true;
          playButton.textContent = "일시정지";
          showNextStop();
        }
      });

      restartButton.addEventListener("click", function () {
        clearTimeout(tour.timer);
        tour.id += 1;
        tour.index = 0;
        tour.shown = 0;
        tour.lastPano = null;
        tour.playing = true;
        playButton.textContent = "일시정지";
        showNextStop();
      });

      // ---------- 계산을 도와주는 것들 ----------
      // 두 곳 사이의 거리 (미터)
      function meters(a, b) {
        const rad = Math.PI / 180;
        const dLat = (b.getLat() - a.getLat()) * rad;
        const dLng = (b.getLng() - a.getLng()) * rad;
        const h = Math.sin(dLat / 2) ** 2
          + Math.cos(a.getLat() * rad) * Math.cos(b.getLat() * rad) * Math.sin(dLng / 2) ** 2;
        return 6371000 * 2 * Math.asin(Math.sqrt(h));
      }

      // a에서 b를 바라보는 방향 (북쪽이 0, 시계 방향으로 360까지)
      function direction(a, b) {
        const rad = Math.PI / 180;
        const dLng = (b.getLng() - a.getLng()) * rad;
        const y = Math.sin(dLng) * Math.cos(b.getLat() * rad);
        const x = Math.cos(a.getLat() * rad) * Math.sin(b.getLat() * rad)
          - Math.sin(a.getLat() * rad) * Math.cos(b.getLat() * rad) * Math.cos(dLng);
        return (Math.atan2(y, x) / rad + 360) % 360;
      }

      // 걸리는 시간(초)을 "12분" 또는 "1시간 20분" 같은 글자로
      function timeText(seconds) {
        const minutes = Math.max(1, Math.round(seconds / 60));
        if (minutes < 60) return minutes + "분";
        return Math.floor(minutes / 60) + "시간 " + (minutes % 60) + "분";
      }

      // 거리를 "350m" 또는 "1.2km" 같은 글자로
      function distanceText(m) {
        return m < 1000 ? Math.round(m) + "m" : (m / 1000).toFixed(1) + "km";
      }

      // 길 위에 로드뷰를 볼 자리들을 일정한 간격으로 찍기
      function makeStops(path) {
        let total = 0;
        for (let i = 1; i < path.length; i++) total += meters(path[i - 1], path[i]);
        const gap = Math.max(STEP_METERS, total / MAX_STEPS);

        const stops = [path[0]];
        let left = gap; // 다음 자리까지 남은 거리
        for (let i = 1; i < path.length; i++) {
          const a = path[i - 1];
          const b = path[i];
          const length = meters(a, b);
          let walked = 0;
          while (length - walked >= left) {
            walked += left;
            const t = walked / length;
            stops.push(new kakao.maps.LatLng(
              a.getLat() + (b.getLat() - a.getLat()) * t,
              a.getLng() + (b.getLng() - a.getLng()) * t
            ));
            left = gap;
          }
          left -= length - walked;
        }
        stops.push(path[path.length - 1]);
        return stops;
      }
    }
  </script>
