<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>길찾기</title>

  <!-- 지도를 그려 주는 도구(Leaflet) 불러오기 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
      color: #1f2430;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #2f6bff;
      color: #ffffff;
    }
    header h1 { margin: 0; font-size: 22px; }
    header a { color: #ffffff; font-size: 14px; }
    #map { flex: 1; }
  </style>
</head>
<body>
  <header>
    <h1>🗺️ 길찾기</h1>
    <a href="../">처음 화면으로</a>
  </header>

  <!-- 지도가 그려지는 자리 -->
  <div id="map"></div>

  <script>
    // 지도가 처음 보여 줄 곳 (지금은 서울시청)
    // 숫자를 바꾸면 다른 곳에서 시작해요: [위도, 경도]
    const startPlace = [37.5665, 126.9780];

    // 처음 확대 정도 (숫자가 클수록 가까이 보여요)
    const startZoom = 15;

    // 지도 만들기
    const map = L.map("map").setView(startPlace, startZoom);

    // 지도 그림(타일) 가져오기 - 무료 오픈 지도(OpenStreetMap)
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> 기여자'
    }).addTo(map);

    // 시작한 곳에 핀 꽂기
    L.marker(startPlace).addTo(map).bindPopup("여기서 시작해요!").openPopup();
  </script>
</body>
</html>
