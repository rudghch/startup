<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>잉스타</title>
  <link rel="icon" href="logo.png">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
      background: #fafafa;
      color: #1f2430;
    }
    button, input, textarea { font-family: inherit; }
    [hidden] { display: none !important; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 14px 16px;
      background: #ffffff;
      border-bottom: 1px solid #e1e5ee;
    }
    header h1 { margin: 0; font-size: 22px; display: flex; align-items: center; gap: 8px; }
    header h1 img { width: 32px; height: 32px; }
    header a { color: #3b6cf6; font-size: 14px; }
    /* 이름을 누르면 처음 화면으로 돌아가요 */
    header h1 a { display: flex; align-items: center; gap: 8px; color: inherit; font-size: inherit; text-decoration: none; }
    .me-box { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 8px 12px; font-size: 15px; }

    /* 하얀 작은 버튼 (로그아웃, 닫기, 사진 고르기) */
    .plain-button {
      display: inline-block;
      padding: 6px 12px;
      font-size: 14px;
      border: 1px solid #d5dbe6;
      border-radius: 8px;
      background: #ffffff;
      color: #1f2430;
      cursor: pointer;
    }
    .plain-button:hover { background: #f1f3f8; }

    /* 내 프로필 버튼 (프로필 사진 + 아이디) */
    .me-button {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px 3px 3px;
      font-size: 15px;
      font-weight: bold;
      border: 1px solid #d5dbe6;
      border-radius: 20px;
      background: #ffffff;
      color: #1f2430;
      cursor: pointer;
    }
    .me-button:hover { background: #f1f3f8; }

    /* 동그란 프로필 사진 (사진이 없으면 아이디 첫 글자) */
    .avatar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      overflow: hidden;
      color: #ffffff;
      font-size: 15px;
      font-weight: bold;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .avatar.small { width: 26px; height: 26px; font-size: 13px; }
    .avatar.big { width: 96px; height: 96px; font-size: 40px; }

    main { max-width: 900px; margin: 0 auto; padding: 20px 16px 40px; }

    /* 로그인 / 계정 만들기 */
    .login { max-width: 360px; margin: 20px auto; }
    .login h2 { margin: 0 0 6px; font-size: 22px; }
    .login p { margin: 0 0 16px; font-size: 14px; color: #5b6272; line-height: 1.5; }
    .login form { display: flex; flex-direction: column; gap: 8px; }
    .login input {
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid #d5dbe6;
      border-radius: 12px;
    }
    .error { min-height: 20px; margin-top: 8px; font-size: 13px; color: #c0392b; }
    .link-button {
      margin-top: 8px;
      padding: 8px 0;
      font-size: 15px;
      border: none;
      background: none;
      color: #3b6cf6;
      text-decoration: underline;
      cursor: pointer;
    }

    /* 분홍 버튼 (새 게시물, 로그인, 저장) */
    .upload-button {
      display: inline-block;
      padding: 12px 22px;
      font-size: 17px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      background: #e1306c;
      color: #ffffff;
      cursor: pointer;
    }
    .upload-button:hover { background: #c81f5a; }
    .upload-button:disabled { background: #e3e6ee; color: #8a91a1; cursor: default; }
    .hidden-file:focus-visible + label { outline: 3px solid #1f2430; }
    /* 진짜 파일 선택 칸은 숨기고, 옆의 버튼을 대신 눌러요 */
    .hidden-file { position: absolute; width: 1px; height: 1px; opacity: 0; }

    .count { margin: 16px 0; color: #5b6272; font-size: 15px; }
    .empty { padding: 60px 0; text-align: center; color: #8a91a1; font-size: 17px; }

    /* 게시물 목록 */
    .photo-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
      align-items: start;
    }
    .photo-card {
      background: #ffffff;
      border: 1px solid #e1e5ee;
      border-radius: 14px;
      overflow: hidden;
    }
    /* 누가 올렸는지 (프로필 사진 + 아이디) */
    .who-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .who-row b { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .photo-card .who-row { padding: 10px 12px; }
    /* 사진을 누르면 크게 보여요 */
    .photo-card .photo {
      position: relative;
      display: block;
      width: 100%;
      padding: 0;
      border: none;
      background: #f1f3f8;
      cursor: zoom-in;
    }
    .photo-card .photo img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
    }
    /* 사진이 여러 장이면 오른쪽 위에 몇 장인지 */
    .photo-card .many {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 3px 9px;
      font-size: 13px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.6);
      color: #ffffff;
    }
    /* 사진 아래의 글 (길면 4줄까지만) */
    .photo-card .caption {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 4;
      overflow: hidden;
      margin: 10px 12px 0;
      font-size: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    /* 사진 없이 글만 있는 게시물: 글을 사진 자리에 크게 */
    .photo-card .text-post {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      aspect-ratio: 1 / 1;
      padding: 18px;
      border: none;
      background: #fff0f5;
      color: #1f2430;
      font-size: 20px;
      font-weight: bold;
      line-height: 1.5;
      text-align: center;
      cursor: pointer;
    }
    .photo-card .text-post span {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 7;
      overflow: hidden;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .photo-card .info {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 46px;
      padding: 8px 12px;
    }
    /* 좋아요 수와 댓글 수 (누르면 크게 보기) */
    .counts {
      padding: 4px 0;
      font-size: 15px;
      font-weight: bold;
      border: none;
      background: none;
      color: #1f2430;
      white-space: pre;
      cursor: pointer;
    }
    .counts .heart { color: #e1306c; }
    .date { font-size: 13px; color: #5b6272; }
    .photo-card .date { margin-left: auto; }
    .delete-button {
      flex-shrink: 0;
      padding: 6px 12px;
      font-size: 14px;
      border: 1px solid #e0b4b4;
      border-radius: 8px;
      background: #fff5f5;
      color: #c0392b;
      cursor: pointer;
    }
    .delete-button:hover { background: #ffe3e3; }

    /* 화면 위에 뜨는 창 (새 게시물, 크게 보기, 내 프로필) */
    dialog {
      width: min(560px, calc(100% - 24px));
      max-height: calc(100% - 24px);
      padding: 0;
      border: none;
      border-radius: 16px;
      color: #1f2430;
    }
    dialog::backdrop { background: rgba(0, 0, 0, 0.6); }
    .dialog-body { padding: 14px 16px 16px; }
    .dialog-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
    .dialog-top h2 { margin: 0; font-size: 20px; }
    .hint { margin: 0 0 12px; font-size: 14px; color: #5b6272; line-height: 1.5; }
    .button-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .button-row.end { justify-content: flex-end; }

    /* 새 게시물 */
    #composeText {
      display: block;
      width: 100%;
      min-height: 110px;
      margin-bottom: 10px;
      padding: 12px 14px;
      font-size: 16px;
      line-height: 1.5;
      border: 1px solid #d5dbe6;
      border-radius: 12px;
      resize: vertical;
    }
    .thumbs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; }
    .thumb { position: relative; }
    .thumb img { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 8px; }
    .thumb button {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 24px;
      height: 24px;
      padding: 0;
      font-size: 13px;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.65);
      color: #ffffff;
      cursor: pointer;
    }

    /* 크게 보기 */
    .slides { position: relative; }
    #viewImage {
      display: block;
      width: 100%;
      max-height: 55vh;
      object-fit: contain;
      border-radius: 10px;
      background: #f1f3f8;
    }
    .slide-button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      padding: 0;
      font-size: 22px;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      color: #ffffff;
      cursor: pointer;
    }
    .slide-button:disabled { opacity: 0.25; cursor: default; }
    #prevButton { left: 8px; }
    #nextButton { right: 8px; }
    #slideCount {
      position: absolute;
      bottom: 8px;
      right: 8px;
      padding: 3px 9px;
      font-size: 13px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.6);
      color: #ffffff;
    }
    #viewText { margin: 12px 0 0; font-size: 17px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
    .like-row { display: flex; align-items: center; gap: 10px; margin: 12px 0; font-size: 15px; }
    .like-button {
      padding: 8px 14px;
      font-size: 16px;
      font-weight: bold;
      border: 1px solid #e1306c;
      border-radius: 20px;
      background: #ffffff;
      color: #e1306c;
      cursor: pointer;
    }
    .like-button.on { background: #e1306c; color: #ffffff; }
    .like-button:disabled { opacity: 0.6; cursor: default; }

    .comments h3 { margin: 0 0 8px; font-size: 16px; }
    .comment { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
    .comment .body { flex: 1; min-width: 0; }
    .comment .text { font-size: 15px; line-height: 1.4; overflow-wrap: anywhere; }
    .comment .text b { margin-right: 6px; }
    .comment .text.hidden-text { color: #8a91a1; }
    /* 댓글 아래의 작은 버튼들 (좋아요, 답글 달기, 삭제) */
    .comment .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 2px; font-size: 13px; color: #5b6272; }
    .comment .actions button {
      padding: 2px 0;
      font-size: 13px;
      border: none;
      background: none;
      color: #5b6272;
      cursor: pointer;
    }
    .comment .actions button:hover { text-decoration: underline; }
    .comment .actions .on { color: #e1306c; font-weight: bold; }
    .comment .actions .danger { color: #c0392b; }
    /* 답글은 안쪽으로 들여서 */
    .replies { margin-left: 34px; }
    .no-comment { margin: 0 0 10px; font-size: 14px; color: #8a91a1; }
    .reply-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; padding: 6px 10px; font-size: 13px; border-radius: 8px; background: #f1f3f8; }
    .reply-bar button { padding: 2px 6px; font-size: 13px; border: none; background: none; color: #3b6cf6; cursor: pointer; }
    .comment-form { display: flex; gap: 8px; }
    .comment-form input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid #d5dbe6;
      border-radius: 12px;
    }
    .comment-form .upload-button { padding: 10px 16px; font-size: 15px; }

    /* 내 프로필 */
    .profile-preview { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 18px; }
  </style>
</head>
<body>
  <header>
    <h1><a href="../" title="처음 화면으로"><img src="logo.png" alt="잉스타 로고">잉스타</a></h1>
    <!-- 로그인하기 전에는 "처음 화면으로"만 보여요 -->
    <a href="../" id="homeLink">처음 화면으로</a>
    <div class="me-box" id="meBox" hidden>
      <!-- 로그인한 뒤에도 다른 곳으로 갈 수 있는 길 -->
      <a href="../">처음 화면</a>
      <a href="../메신저/">message</a>
      <!-- 누르면 내 프로필을 바꾸는 창이 열려요 -->
      <button type="button" class="me-button" id="profileButton" title="내 프로필 바꾸기"></button>
      <button type="button" class="plain-button" id="logoutButton">로그아웃</button>
    </div>
  </header>

  <main>
    <!-- 1. 로그인 / 계정 만들기 -->
    <div class="login" id="loginBox" hidden>
      <h2 id="loginTitle">로그인</h2>
      <p id="loginHelp"></p>
      <form id="loginForm">
        <input type="text" id="idInput" placeholder="아이디 (2~12글자)" maxlength="12" autocomplete="username" aria-label="아이디">
        <input type="password" id="passwordInput" placeholder="비밀번호 (4글자부터)" maxlength="50" autocomplete="current-password" aria-label="비밀번호">
        <input type="text" id="codeInput" placeholder="가입 코드 (선생님께 물어보세요)" maxlength="30" autocomplete="off" aria-label="가입 코드" hidden>
        <button type="submit" class="upload-button" id="loginButton">로그인</button>
      </form>
      <div class="error" id="loginError"></div>
      <button type="button" class="link-button" id="modeButton">처음이에요. 계정 만들기</button>
    </div>

    <!-- 2. 게시물 목록 -->
    <div id="feedBox" hidden>
      <button type="button" class="upload-button" id="composeButton">＋ 새 게시물</button>

      <p class="count" id="count"></p>

      <!-- 게시물이 그려지는 곳 -->
      <div class="photo-list" id="photoList"></div>
      <p class="empty" id="empty" hidden>아직 게시물이 없어요. 첫 게시물을 올려 보세요!</p>
    </div>
  </main>

  <!-- 3. 새 게시물을 쓰는 창: 글과 사진(10장까지) -->
  <dialog id="composeDialog" aria-label="새 게시물">
    <div class="dialog-body">
      <div class="dialog-top">
        <h2>새 게시물</h2>
        <button type="button" class="plain-button" id="composeCloseButton">닫기</button>
      </div>
      <textarea id="composeText" maxlength="500" placeholder="무슨 이야기를 할까요? (글만 올려도 되고, 사진만 올려도 돼요)" aria-label="글"></textarea>
      <div class="button-row">
        <input type="file" class="hidden-file" id="photoInput" accept="image/*" multiple>
        <label for="photoInput" class="plain-button">사진 고르기</label>
        <span class="date" id="composeCount"></span>
      </div>
      <div class="thumbs" id="composeThumbs"></div>
      <p class="hint" style="margin-top: 10px">진짜 이름이나 얼굴이 나온 사진은 올리지 않아요.</p>
      <div class="error" id="composeError"></div>
      <div class="button-row end">
        <button type="button" class="upload-button" id="composeSaveButton">올리기</button>
      </div>
    </div>
  </dialog>

  <!-- 4. 게시물을 누르면 뜨는 창: 크게 보기, 좋아요, 댓글 -->
  <dialog id="viewDialog" aria-label="게시물 크게 보기">
    <div class="dialog-body">
      <div class="dialog-top">
        <div class="who-row" id="viewWho"></div>
        <button type="button" class="plain-button" id="viewCloseButton">닫기</button>
      </div>

      <!-- 사진이 여러 장이면 ‹ › 로 넘겨 봐요 -->
      <div class="slides" id="slides">
        <img id="viewImage" alt="">
        <button type="button" class="slide-button" id="prevButton" aria-label="앞 사진">‹</button>
        <button type="button" class="slide-button" id="nextButton" aria-label="다음 사진">›</button>
        <span id="slideCount"></span>
      </div>
      <p id="viewText"></p>

      <div class="like-row">
        <button type="button" class="like-button" id="likeButton">♡ 좋아요</button>
        <span id="likeCount"></span>
      </div>

      <div class="comments">
        <h3 id="commentTitle">댓글</h3>
        <div id="commentList"></div>
        <div class="reply-bar" id="replyBar" hidden>
          <span id="replyText"></span>
          <button type="button" id="replyCancelButton">취소</button>
        </div>
        <form class="comment-form" id="commentForm">
          <input type="text" id="commentInput" placeholder="댓글 달기" maxlength="200" autocomplete="off" aria-label="댓글">
          <button type="submit" class="upload-button" id="commentButton">올리기</button>
        </form>
        <div class="error" id="viewError"></div>
      </div>
    </div>
  </dialog>

  <!-- 5. 내 프로필을 바꾸는 창 -->
  <dialog id="profileDialog" aria-label="내 프로필">
    <div class="dialog-body">
      <div class="dialog-top">
        <h2>내 프로필</h2>
        <button type="button" class="plain-button" id="profileCloseButton">닫기</button>
      </div>
      <div class="profile-preview">
        <span id="profilePreview"></span>
        <b id="profileName"></b>
      </div>
      <p class="hint">프로필 사진은 로그인한 친구 모두에게 보여요. 얼굴이 나온 사진 말고 그림이나 풍경 사진을 골라 주세요.</p>
      <div class="button-row">
        <input type="file" class="hidden-file" id="profileInput" accept="image/*">
        <label for="profileInput" class="plain-button">사진 고르기</label>
        <button type="button" class="plain-button" id="profileResetButton">기본 그림으로</button>
      </div>
      <div class="error" id="profileError"></div>
      <div class="button-row end">
        <button type="button" class="upload-button" id="profileSaveButton">저장</button>
      </div>
    </div>
  </dialog>

  <script>
    // ───────── 서버 ─────────
    // 계정과 게시물은 서버(인터넷에 있는 컴퓨터)에 저장해요. 메신저와 같은 서버, 같은 계정을 써요.
    const API_URL = "https://be7dswschuowu4qnq5kcuwhhiu0zdxdj.lambda-url.ap-northeast-2.on.aws/"; // 서버 주소
    const BOARD = "instar"; // 잉스타 게시물을 모아 두는 게시판 이름
    const PROFILE_BOARD = "instarprofile"; // 프로필 사진을 모아 두는 게시판 이름

    // 로그인했다는 표(토큰)를 이 브라우저에 기억해요.
    // 메신저와 같은 이름을 써서, 한 번 로그인하면 메신저와 잉스타 둘 다 들어가져요.
    const TOKEN_KEY = "messenger.token";

    // 사진이 너무 크면 올리는 데 오래 걸리니까 이 크기로 줄여요
    const MAX_SIZE = 1280;
    const PROFILE_SIZE = 320; // 프로필 사진은 더 작게

    const MAX_PHOTOS = 10;   // 게시물 하나에 올릴 수 있는 사진 수
    const SERVER_PHOTOS = 6; // 서버가 글 하나에 받아 주는 사진 수 (넘는 사진은 따로 묶어서 올려요)

    // 글 속에 숨겨 두는 표시. 화면에는 안 보이고 키보드로도 칠 수 없는 글자라서 진짜 글과 헷갈리지 않아요.
    const MARK = "\u0001";

    let token = localStorage.getItem(TOKEN_KEY);
    let me = null; // 지금 로그인한 계정 아이디 (없으면 null)

    // 서버가 알려 주는 문제를 쉬운 말로 바꾸기
    const ERROR_TEXT = {
      BAD_ID: "아이디는 띄어쓰기 없이 2~12글자로 적어 주세요.",
      BAD_PASSWORD: "비밀번호는 4글자부터 적을 수 있어요.",
      BAD_CODE: "가입 코드가 맞지 않아요. 선생님께 물어보세요.",
      ID_TAKEN: "이미 누가 쓰고 있는 아이디예요. 다른 아이디를 적어 주세요.",
      WRONG_LOGIN: "아이디나 비밀번호가 맞지 않아요.",
      NOT_LOGGED_IN: "다시 로그인해 주세요.",
      BAD_FILE: "사진만 올릴 수 있어요.",
      BAD_POST: "글이 비어 있거나 너무 길어요.",
      BAD_WORD: "나쁜 말이 들어 있어서 올릴 수 없어요. 고운 말로 바꿔 주세요.",
      NOT_YOURS: "내가 올린 것만 지울 수 있어요.",
      NO_SERVER: "서버에 연결하지 못했어요. 인터넷을 확인해 주세요."
    };
    function errorText(error) {
      return ERROR_TEXT[error.message] || "문제가 생겼어요. 잠시 뒤에 다시 해 주세요.";
    }

    // 서버에 일 시키기 (action: 시킬 일 이름, data: 함께 보낼 내용)
    async function call(action, data) {
      let response;
      try {
        response = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(Object.assign({ action: action, token: token }, data))
        });
      } catch (error) {
        throw new Error("NO_SERVER");
      }
      const result = await response.json().catch(function () { return null; });
      if (!response.ok) throw new Error((result && result.error) || "SERVER_ERROR");
      return result;
    }

    // ───────── 나쁜 말 막기 (message와 같은 목록) ─────────
    // 여기 적힌 말이 들어 있으면 글과 댓글을 올릴 수 없어요. 막고 싶은 말을 더 적거나 뺄 수 있어요.
    const BAD_WORDS = [
      "시발", "씨발", "씨빨", "씨바", "씨팔", "시팔", "ㅅㅂ", "ㅆㅂ",
      "병신", "븅신", "ㅂㅅ", "지랄", "ㅈㄹ", "존나", "좆나", "ㅈㄴ", "좆", "썅",
      "개새끼", "개새", "새끼야", "미친놈", "미친년", "미친새끼", "또라이", "등신",
      "닥쳐", "엿먹어", "꺼져라", "죽어라", "뒤져라",
      "fuck", "shit", "bitch"
    ];
    // 글자 사이에 숫자나 기호를 끼워 넣어도("시1발", "시.발") 찾아내요
    const BAD_WORD_PATTERN = new RegExp(
      BAD_WORDS.slice().sort(function (a, b) { return b.length - a.length; }).map(function (word) {
        return Array.from(word).join("[^가-힣ㄱ-ㅎㅏ-ㅣa-zA-Z\\s]*");
      }).join("|"),
      "gi"
    );
    function hasBadWords(text) {
      BAD_WORD_PATTERN.lastIndex = 0;
      return BAD_WORD_PATTERN.test(text);
    }
    function hideBadWords(text) {
      return text.replace(BAD_WORD_PATTERN, "###");
    }

    // ───────── 프로필 사진 ─────────
    const AVATAR_COLORS = ["#e1306c", "#3b6cf6", "#1e9e6a", "#e67e22", "#8e44ad", "#16a3b8", "#c0392b", "#5b6272"];
    let profiles = {};    // 아이디 → 프로필 사진 주소 (사진을 정한 계정만 들어 있어요)
    let profilesKey = ""; // 프로필이 바뀌었는지 알아보는 표시

    // 아이디마다 항상 같은 색이 나오게 하기
    function colorOf(id) {
      let sum = 0;
      for (const ch of id) sum += ch.codePointAt(0);
      return AVATAR_COLORS[sum % AVATAR_COLORS.length];
    }

    // 동그란 프로필 만들기. 사진을 정했으면 사진, 아니면 아이디 첫 글자
    // (url을 따로 주면 그 사진을 써요. null을 주면 사진 없이 첫 글자만)
    function makeAvatar(id, size, url) {
      const avatar = document.createElement("span");
      avatar.className = size ? "avatar " + size : "avatar";
      if (url === undefined) url = profiles[id];
      if (url) {
        const image = document.createElement("img");
        image.src = url;
        image.alt = "";
        avatar.appendChild(image);
      } else {
        avatar.style.background = colorOf(id);
        avatar.textContent = Array.from(id)[0];
      }
      return avatar;
    }

    // 프로필 사진 + 아이디 한 줄 만들기
    function fillWho(box, id) {
      box.innerHTML = "";
      const name = document.createElement("b");
      name.textContent = id;
      box.append(makeAvatar(id), name);
    }

    // 서버에서 받은 프로필 목록을 정리하기 (한 계정에 여러 개면 가장 새것)
    function readProfiles(list) {
      const map = {};
      const keys = [];
      list.forEach(function (item) { // 새것부터 와요
        if (item.author in map || !item.media || !item.media[0]) return;
        map[item.author] = item.media[0].url;
        keys.push(item.sk);
      });
      profiles = map;
      profilesKey = keys.join(",");
    }

    // ───────── 로그인과 계정 만들기 ─────────
    const loginBox = document.getElementById("loginBox");
    const feedBox = document.getElementById("feedBox");
    const loginForm = document.getElementById("loginForm");
    const idInput = document.getElementById("idInput");
    const passwordInput = document.getElementById("passwordInput");
    const codeInput = document.getElementById("codeInput");
    const loginButton = document.getElementById("loginButton");
    const loginError = document.getElementById("loginError");
    const modeButton = document.getElementById("modeButton");
    const homeLink = document.getElementById("homeLink");
    const meBox = document.getElementById("meBox");
    const profileButton = document.getElementById("profileButton");
    const composeDialog = document.getElementById("composeDialog");
    const viewDialog = document.getElementById("viewDialog");
    const profileDialog = document.getElementById("profileDialog");

    let signupMode = false; // true면 계정 만들기, false면 로그인
    let needsCode = true;   // 가입 코드가 필요한지 (서버에 물어봐요)

    function setMode(signup) {
      signupMode = signup;
      document.getElementById("loginTitle").textContent = signup ? "계정 만들기" : "로그인";
      document.getElementById("loginHelp").textContent = signup
        ? "진짜 이름 말고 별명으로 아이디를 지어 주세요. 비밀번호는 다른 곳에서 쓰는 것 말고 새로 지어 주세요."
        : "message에서 만든 계정이 있으면 그 아이디와 비밀번호로 들어올 수 있어요.";
      loginButton.textContent = signup ? "가입하기" : "로그인";
      modeButton.textContent = signup ? "이미 계정이 있어요. 로그인하기" : "처음이에요. 계정 만들기";
      passwordInput.autocomplete = signup ? "new-password" : "current-password";
      codeInput.hidden = !(signup && needsCode);
      loginError.textContent = "";
    }
    modeButton.addEventListener("click", function () { setMode(!signupMode); });

    // "로그인"이나 "가입하기"를 누르면 서버에 물어보기
    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      const id = idInput.value.trim();
      const password = passwordInput.value;

      if (Array.from(id).length < 2 || /\s/.test(id)) { loginError.textContent = ERROR_TEXT.BAD_ID; return; }
      if (password.length < 4) { loginError.textContent = ERROR_TEXT.BAD_PASSWORD; return; }

      loginButton.disabled = true;
      loginError.textContent = "";
      try {
        const result = signupMode
          ? await call("signup", { id: id, password: password, code: codeInput.value.trim() })
          : await call("login", { id: id, password: password });
        token = result.token;
        localStorage.setItem(TOKEN_KEY, token);
        loginForm.reset();
        enter(result.id);
      } catch (error) {
        loginError.textContent = errorText(error);
      }
      loginButton.disabled = false;
    });

    // 맨 위 오른쪽의 내 프로필 버튼 그리기
    function showMe() {
      fillWho(profileButton, me);
    }

    // 로그인한 뒤 게시물 목록으로 들어가기
    function enter(id) {
      me = id;
      showMe();
      homeLink.hidden = true;
      meBox.hidden = false;
      loginBox.hidden = true;
      feedBox.hidden = false;
      loadPhotos();
    }

    // 로그인 화면으로 돌아가기
    function leave() {
      me = null;
      token = null;
      localStorage.removeItem(TOKEN_KEY);
      shownPhotos = null;
      profiles = {};
      profilesKey = "";
      counts = {};
      photoList.innerHTML = "";
      count.textContent = "";
      composeDialog.close();
      viewDialog.close();
      profileDialog.close();

      homeLink.hidden = false;
      meBox.hidden = true;
      feedBox.hidden = true;
      loginBox.hidden = false;
      setMode(false);
    }

    document.getElementById("logoutButton").addEventListener("click", function () {
      call("logout").catch(function () {}); // 서버에도 알려 주기 (실패해도 괜찮아요)
      leave();
    });

    // ───────── 게시물 목록 ─────────
    const photoList = document.getElementById("photoList");
    const empty = document.getElementById("empty");
    const count = document.getElementById("count");
    let shownPhotos = null; // 지금 화면에 그려 둔 게시물 번호들 (바뀌었을 때만 다시 그려요)

    // 서버가 붙여 준 번호(sk)에는 올린 시간이 들어 있어요
    function dateText(sk) {
      return new Date(Number(String(sk).slice(0, -6))).toLocaleDateString("ko-KR");
    }

    // 게시물마다 좋아요, 댓글, 댓글 좋아요 게시판을 따로 써요.
    // 게시판 이름에는 영어 소문자만 쓸 수 있어서, 게시물 번호의 숫자를 글자로 바꿔요 (0→a, 1→b, ...)
    function reactionBoard(kind, sk) {
      return kind + String(sk).replace(/\d/g, function (digit) { return "abcdefghij"[digit]; });
    }

    // 게시물의 글 읽기. 사진이 6장을 넘으면 나머지 사진을 묶어 둔 곳(moreBoard)이 글 끝에 숨어 있어요.
    function readPost(post) {
      const text = post.text || "";
      const at = text.indexOf(MARK + "m");
      if (at < 0) return { text: text, moreBoard: null, moreCount: 0 };
      const parts = text.slice(at + 2).split(MARK);
      const ok = /^[a-z]{1,20}$/.test(parts[0]);
      return { text: text.slice(0, at), moreBoard: ok ? parts[0] : null, moreCount: ok ? Number(parts[1]) || 0 : 0 };
    }

    // 사진 파일을 작게 줄이기 (maxSize: 가장 긴 쪽의 길이)
    function shrinkPhoto(file, maxSize) {
      return new Promise(function (resolve, reject) {
        const image = new Image();
        image.onload = function () {
          const scale = Math.min(1, maxSize / Math.max(image.width, image.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(image.width * scale);
          canvas.height = Math.round(image.height * scale);
          canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(image.src);
          canvas.toBlob(function (blob) { blob ? resolve(blob) : reject(new Error("SERVER_ERROR")); }, "image/jpeg", 0.85);
        };
        image.onerror = reject;
        image.src = URL.createObjectURL(file);
      });
    }

    // 사진 하나를 서버 보관함에 올리고, 보관함 안의 이름(key)을 돌려받기
    async function uploadFile(blob) {
      const place = await call("upload", { type: blob.type });
      let response;
      try {
        response = await fetch(place.url, { method: "PUT", headers: { "Content-Type": blob.type }, body: blob });
      } catch (error) {
        throw new Error("NO_SERVER");
      }
      if (!response.ok) throw new Error("SERVER_ERROR");
      return place.key;
    }

    // 서버에서 게시물 목록과 프로필을 받아 와서 화면에 그리기
    async function loadPhotos() {
      let posts;
      try {
        const results = await Promise.all([
          call("posts", { board: BOARD }),
          call("posts", { board: PROFILE_BOARD })
        ]);
        posts = results[0];
        if (!me) return;
        readProfiles(results[1]);
      } catch (error) {
        if (error.message === "NOT_LOGGED_IN") leave();
        return;
      }

      // 바뀐 게 없으면 그대로 두기
      const ids = posts.map(function (post) { return post.sk; }).join(",") + "|" + profilesKey;
      if (ids === shownPhotos) return;
      shownPhotos = ids;
      showMe();
      cardWatcher.disconnect();
      visiblePosts.clear();
      photoList.innerHTML = "";

      posts.forEach(function (post) {
        const content = readPost(post);
        const media = post.media || [];
        const total = media.length + content.moreCount;
        const text = hideBadWords(content.text);
        function open() { openPost(post); }

        const card = document.createElement("div");
        card.className = "photo-card";
        card.dataset.sk = post.sk;

        // 누가 올렸는지: 프로필 사진과 아이디
        const who = document.createElement("div");
        who.className = "who-row";
        fillWho(who, post.author);
        card.appendChild(who);

        if (media.length > 0) {
          // 첫 사진 (누르면 크게 보기)
          const photoButton = document.createElement("button");
          photoButton.type = "button";
          photoButton.className = "photo";
          photoButton.title = "크게 보기";
          const image = document.createElement("img");
          image.src = media[0].url;
          image.alt = post.author + "님이 올린 사진";
          photoButton.appendChild(image);
          if (total > 1) {
            const many = document.createElement("span");
            many.className = "many";
            many.textContent = "사진 " + total + "장";
            photoButton.appendChild(many);
          }
          photoButton.addEventListener("click", open);
          card.appendChild(photoButton);

          if (text) {
            const caption = document.createElement("p");
            caption.className = "caption";
            caption.textContent = text;
            card.appendChild(caption);
          }
        } else {
          // 글만 있는 게시물은 글을 크게
          const textButton = document.createElement("button");
          textButton.type = "button";
          textButton.className = "text-post";
          textButton.title = "크게 보기";
          const span = document.createElement("span");
          span.textContent = text;
          textButton.appendChild(span);
          textButton.addEventListener("click", open);
          card.appendChild(textButton);
        }

        const info = document.createElement("div");
        info.className = "info";

        // 좋아요 수와 댓글 수 (화면에 보일 때 서버에서 받아 와요)
        const countsButton = document.createElement("button");
        countsButton.type = "button";
        countsButton.className = "counts";
        countsButton.addEventListener("click", open);
        info.appendChild(countsButton);

        const date = document.createElement("span");
        date.className = "date";
        date.textContent = dateText(post.sk);
        info.appendChild(date);

        // 내가 올린 게시물만 지울 수 있어요
        if (post.author === me) {
          const deleteButton = document.createElement("button");
          deleteButton.type = "button";
          deleteButton.className = "delete-button";
          deleteButton.textContent = "삭제";
          deleteButton.addEventListener("click", function () {
            deletePost(post);
          });
          info.appendChild(deleteButton);
        }

        card.appendChild(info);
        photoList.appendChild(card);
        showCounts(post.sk);
        cardWatcher.observe(card);
      });

      empty.hidden = posts.length > 0;
      count.textContent = posts.length > 0 ? "게시물 " + posts.length + "개" : "";
    }

    // 게시물 삭제하기
    async function deletePost(post) {
      if (!confirm("이 게시물을 삭제할까요?")) return;

      try {
        // 6장을 넘어서 따로 묶어 둔 사진이 있으면 그것부터 지워요
        const more = readPost(post).moreBoard;
        if (more) {
          for (const item of await call("posts", { board: more })) {
            if (item.author === me) await call("remove", { board: more, sk: item.sk });
          }
        }
        await call("remove", { board: BOARD, sk: post.sk });
      } catch (error) {
        alert(errorText(error));
      }
      loadPhotos();
    }

    // ───────── 목록에 보이는 좋아요 수와 댓글 수 ─────────
    let counts = {};                 // 게시물 번호 → { likes, liked, comments }
    const visiblePosts = new Set();  // 지금 화면에 보이는 게시물 번호들
    const countQueue = [];           // 서버에 물어볼 차례를 기다리는 게시물 번호들
    let countRunning = 0;            // 지금 서버에 물어보고 있는 개수 (한꺼번에 4개까지만)

    // 댓글 게시판에서 받은 것을 댓글과 답글로 나누기 (오래된 것부터)
    function readComments(items) {
      const tops = [];
      const bySk = {};
      let total = 0;
      items.slice().reverse().forEach(function (item) {
        const text = item.text || "";
        if (text[0] !== MARK) {
          const comment = { sk: item.sk, author: item.author, text: text, replies: [] };
          bySk[item.sk] = comment;
          tops.push(comment);
          total++;
        } else if (text[1] === "r") {
          // 답글: 표시 뒤에 어느 댓글의 답글인지 번호가 적혀 있어요
          const end = text.indexOf(MARK, 2);
          const parent = bySk[text.slice(2, end)];
          if (end < 0 || !parent) return; // 지워진 댓글의 답글은 보여 주지 않아요
          parent.replies.push({ sk: item.sk, author: item.author, text: text.slice(end + 1) });
          total++;
        }
      });
      return { tops: tops, total: total };
    }

    // 좋아요 목록에서 몇 명이 눌렀는지, 내가 누른 것은 무엇인지 세기
    function readLikes(likes) {
      return {
        people: new Set(likes.map(function (like) { return like.author; })).size,
        mine: likes.filter(function (like) { return like.author === me; }).map(function (like) { return like.sk; })
      };
    }

    // 카드에 좋아요 수와 댓글 수 적기
    function showCounts(sk) {
      const button = photoList.querySelector('[data-sk="' + sk + '"] .counts');
      if (!button) return;
      const data = counts[sk];
      button.innerHTML = "";
      const heart = document.createElement("span");
      heart.className = "heart";
      heart.textContent = data && data.liked ? "♥ " : "♡ ";
      button.append(heart, (data ? data.likes : "·") + "   💬 " + (data ? data.comments : "·"));
      button.title = data ? "좋아요 " + data.likes + "개, 댓글 " + data.comments + "개" : "";
    }

    function saveCounts(sk, likes, comments) {
      const like = readLikes(likes);
      counts[sk] = { likes: like.people, liked: like.mine.length > 0, comments: readComments(comments).total };
      showCounts(sk);
    }

    // 게시물 하나의 좋아요와 댓글을 서버에 물어보기 (차례대로, 한꺼번에 4개까지만)
    function askCounts(sk) {
      if (countQueue.includes(sk)) return;
      countQueue.push(sk);
      nextCounts();
    }
    function nextCounts() {
      while (countRunning < 4 && countQueue.length > 0) {
        const sk = countQueue.shift();
        countRunning++;
        Promise.all([
          call("posts", { board: reactionBoard("l", sk) }),
          call("posts", { board: reactionBoard("c", sk) })
        ]).then(function (results) {
          if (me) saveCounts(sk, results[0], results[1]);
        }).catch(function () {}).finally(function () {
          countRunning--;
          nextCounts();
        });
      }
    }

    // 카드가 화면에 보이기 시작하면 그 게시물의 수를 물어봐요 (안 보이는 것까지 물어보면 느려져요)
    const cardWatcher = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        const sk = entry.target.dataset.sk;
        if (entry.isIntersecting) {
          visiblePosts.add(sk);
          askCounts(sk);
        } else {
          visiblePosts.delete(sk);
        }
      });
    });

    // ───────── 새 게시물 쓰기 ─────────
    const composeText = document.getElementById("composeText");
    const photoInput = document.getElementById("photoInput");
    const composeThumbs = document.getElementById("composeThumbs");
    const composeCount = document.getElementById("composeCount");
    const composeError = document.getElementById("composeError");
    const composeSaveButton = document.getElementById("composeSaveButton");
    let composePhotos = []; // 고른 사진들 { blob: 줄인 사진, url: 미리보기 주소 }

    // 고른 사진들을 작은 그림으로 보여 주기
    function showThumbs() {
      composeThumbs.innerHTML = "";
      composePhotos.forEach(function (photo, index) {
        const thumb = document.createElement("div");
        thumb.className = "thumb";
        const image = document.createElement("img");
        image.src = photo.url;
        image.alt = (index + 1) + "번째 사진";
        const removeButton = document.createElement("button");
        removeButton.type = "button";
        removeButton.textContent = "✕";
        removeButton.setAttribute("aria-label", (index + 1) + "번째 사진 빼기");
        removeButton.addEventListener("click", function () {
          URL.revokeObjectURL(photo.url);
          composePhotos.splice(index, 1);
          showThumbs();
        });
        thumb.append(image, removeButton);
        composeThumbs.appendChild(thumb);
      });
      composeCount.textContent = "사진 " + composePhotos.length + " / " + MAX_PHOTOS + "장";
    }

    function clearCompose() {
      composePhotos.forEach(function (photo) { URL.revokeObjectURL(photo.url); });
      composePhotos = [];
      composeText.value = "";
      composeError.textContent = "";
      showThumbs();
    }

    document.getElementById("composeButton").addEventListener("click", function () {
      composeError.textContent = "";
      showThumbs();
      composeDialog.showModal();
    });

    // 사진을 고르면 작게 줄여서 미리 보여 주기 (아직 올리지는 않아요)
    async function pickPhotos(files) {
      composeError.textContent = "";
      for (const file of files) {
        if (!file.type.startsWith("image/")) { composeError.textContent = ERROR_TEXT.BAD_FILE; continue; }
        if (composePhotos.length >= MAX_PHOTOS) {
          composeError.textContent = "사진은 " + MAX_PHOTOS + "장까지 올릴 수 있어요.";
          break;
        }
        try {
          const blob = await shrinkPhoto(file, MAX_SIZE);
          composePhotos.push({ blob: blob, url: URL.createObjectURL(blob) });
        } catch (error) {
          composeError.textContent = "이 사진은 열 수 없어요: " + file.name;
        }
      }
      showThumbs();
    }
    photoInput.addEventListener("change", function () {
      pickPhotos(Array.from(photoInput.files));
      photoInput.value = ""; // 같은 사진을 또 고를 수 있게 비워요
    });

    // "올리기"를 누르면 사진을 서버에 올리고 게시물 만들기
    composeSaveButton.addEventListener("click", async function () {
      // 숨은 표시로 쓰는 글자는 빼고, 줄바꿈은 남겨요
      const text = composeText.value.replace(/[\u0000-\u0009\u000b-\u001f]/g, "").trim();
      if (!text && composePhotos.length === 0) { composeError.textContent = "글을 쓰거나 사진을 골라 주세요."; return; }
      if (hasBadWords(text)) { composeError.textContent = ERROR_TEXT.BAD_WORD; return; }

      composeSaveButton.disabled = true;
      composeError.textContent = "";
      try {
        const media = [];
        for (let i = 0; i < composePhotos.length; i++) {
          composeSaveButton.textContent = "올리는 중... (" + (i + 1) + "/" + composePhotos.length + ")";
          media.push({ kind: "image", key: await uploadFile(composePhotos[i].blob) });
        }

        // 서버는 글 하나에 사진을 6장까지만 받아요.
        // 그래서 7번째부터는 이 게시물만 쓰는 게시판에 따로 묶어 올리고, 그 이름을 글 끝에 숨겨 둬요.
        let hidden = "";
        const more = media.slice(SERVER_PHOTOS);
        if (more.length > 0) {
          let moreBoard = "x";
          for (let i = 0; i < 19; i++) moreBoard += "abcdefghijklmnopqrstuvwxyz"[Math.floor(Math.random() * 26)];
          await call("post", { board: moreBoard, text: "", media: more });
          hidden = MARK + "m" + moreBoard + MARK + more.length;
        }
        await call("post", { board: BOARD, text: text + hidden, media: media.slice(0, SERVER_PHOTOS) });

        clearCompose();
        composeDialog.close();
      } catch (error) {
        composeError.textContent = errorText(error);
        if (error.message === "NOT_LOGGED_IN") leave();
      }
      composeSaveButton.disabled = false;
      composeSaveButton.textContent = "올리기";
      if (me) loadPhotos();
    });

    // ───────── 크게 보기, 좋아요, 댓글 ─────────
    const slides = document.getElementById("slides");
    const viewImage = document.getElementById("viewImage");
    const prevButton = document.getElementById("prevButton");
    const nextButton = document.getElementById("nextButton");
    const slideCount = document.getElementById("slideCount");
    const likeButton = document.getElementById("likeButton");
    const likeCount = document.getElementById("likeCount");
    const commentList = document.getElementById("commentList");
    const commentForm = document.getElementById("commentForm");
    const commentInput = document.getElementById("commentInput");
    const commentButton = document.getElementById("commentButton");
    const replyBar = document.getElementById("replyBar");
    const viewError = document.getElementById("viewError");

    let viewing = null;       // 지금 크게 보고 있는 게시물 (없으면 null)
    let myLikes = [];         // 이 게시물에 내가 누른 좋아요 번호들
    let replyTo = null;       // 답글을 달고 있는 댓글 { sk, author } (그냥 댓글이면 null)
    let shownComments = null; // 지금 그려 둔 댓글 번호들 (바뀌었을 때만 다시 그려요)

    // 지금 차례의 사진 보여 주기
    function showSlide() {
      const view = viewing;
      const total = view.urls.length;
      slides.hidden = total === 0;
      if (total === 0) return;
      viewImage.src = view.urls[view.index];
      viewImage.alt = view.author + "님이 올린 사진 " + (view.index + 1);
      prevButton.hidden = nextButton.hidden = slideCount.hidden = total < 2;
      prevButton.disabled = view.index === 0;
      nextButton.disabled = view.index === total - 1;
      slideCount.textContent = (view.index + 1) + " / " + total;
    }
    function moveSlide(step) {
      if (!viewing) return;
      const next = viewing.index + step;
      if (next < 0 || next >= viewing.urls.length) return;
      viewing.index = next;
      showSlide();
    }
    prevButton.addEventListener("click", function () { moveSlide(-1); });
    nextButton.addEventListener("click", function () { moveSlide(1); });
    // 키보드 화살표로도 넘겨요 (댓글을 쓰는 중에는 빼고)
    viewDialog.addEventListener("keydown", function (event) {
      if (event.target === commentInput) return;
      if (event.key === "ArrowLeft") moveSlide(-1);
      if (event.key === "ArrowRight") moveSlide(1);
    });

    function setReplyTo(comment) {
      replyTo = comment;
      replyBar.hidden = !comment;
      document.getElementById("replyText").textContent = comment ? comment.author + "님에게 답글 쓰는 중" : "";
      commentInput.placeholder = comment ? "답글 달기" : "댓글 달기";
      if (comment) commentInput.focus();
    }
    document.getElementById("replyCancelButton").addEventListener("click", function () { setReplyTo(null); });

    // 게시물을 눌렀을 때: 크게 보여 주는 창 열기
    function openPost(post) {
      const content = readPost(post);
      const view = {
        sk: post.sk,
        author: post.author,
        urls: (post.media || []).map(function (item) { return item.url; }),
        index: 0,
        likeBoard: reactionBoard("l", post.sk),
        commentBoard: reactionBoard("c", post.sk),
        commentLikeBoard: reactionBoard("k", post.sk)
      };
      viewing = view;
      myLikes = [];
      shownComments = null;
      setReplyTo(null);

      fillWho(document.getElementById("viewWho"), post.author);
      const date = document.createElement("span");
      date.className = "date";
      date.textContent = dateText(post.sk);
      document.getElementById("viewWho").appendChild(date);

      showSlide();
      const text = hideBadWords(content.text);
      document.getElementById("viewText").textContent = text;
      document.getElementById("viewText").hidden = !text;

      likeButton.className = "like-button";
      likeButton.textContent = "♡ 좋아요";
      likeButton.disabled = true; // 서버에서 받아 올 때까지 잠깐 기다려요
      likeCount.textContent = "";
      document.getElementById("commentTitle").textContent = "댓글";
      commentList.innerHTML = "";
      commentInput.value = "";
      viewError.textContent = "";

      viewDialog.showModal();
      loadReactions();

      // 6장을 넘어서 따로 묶어 둔 사진이 있으면 받아 와서 뒤에 붙이기
      if (content.moreBoard) {
        call("posts", { board: content.moreBoard }).then(function (items) {
          if (viewing !== view) return;
          items.forEach(function (item) {
            if (item.author !== post.author) return;
            (item.media || []).forEach(function (photo) { view.urls.push(photo.url); });
          });
          showSlide();
        }).catch(function () {});
      }
    }

    // 댓글이나 답글 한 줄 만들기
    function makeComment(view, comment, likes, isReply) {
      const row = document.createElement("div");
      row.className = "comment";
      row.appendChild(makeAvatar(comment.author, "small"));

      const body = document.createElement("div");
      body.className = "body";

      const text = document.createElement("div");
      const name = document.createElement("b");
      name.textContent = comment.author;
      if (hasBadWords(comment.text)) {
        // 나쁜 말이 든 댓글은 통째로 가려요
        text.className = "text hidden-text";
        text.append(name, "나쁜 말이 있어서 가린 댓글이에요.");
      } else {
        text.className = "text";
        text.append(name, comment.text);
      }
      body.appendChild(text);

      const actions = document.createElement("div");
      actions.className = "actions";

      // 댓글 좋아요
      const like = likes[comment.sk] || { people: 0, mine: [] };
      const likeIt = document.createElement("button");
      likeIt.type = "button";
      likeIt.className = like.mine.length > 0 ? "on" : "";
      likeIt.textContent = (like.mine.length > 0 ? "♥ " : "♡ ") + "좋아요" + (like.people > 0 ? " " + like.people : "");
      likeIt.addEventListener("click", function () {
        likeIt.disabled = true;
        toggleCommentLike(view, comment.sk, like.mine);
      });
      actions.appendChild(likeIt);

      // 답글 달기와 답글 수 (답글에는 또 답글을 달지 않아요)
      if (!isReply) {
        const replyButton = document.createElement("button");
        replyButton.type = "button";
        replyButton.textContent = "답글 달기";
        replyButton.addEventListener("click", function () { setReplyTo(comment); });
        actions.appendChild(replyButton);

        if (comment.replies.length > 0) {
          const replyCount = document.createElement("span");
          replyCount.textContent = "답글 " + comment.replies.length + "개";
          actions.appendChild(replyCount);
        }
      }

      // 내가 쓴 것만 지울 수 있어요
      if (comment.author === me) {
        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "danger";
        deleteButton.textContent = "삭제";
        deleteButton.addEventListener("click", function () {
          deleteComment(view, comment.sk);
        });
        actions.appendChild(deleteButton);
      }

      body.appendChild(actions);
      row.appendChild(body);
      return row;
    }

    // 이 게시물의 좋아요와 댓글을 서버에서 받아 와서 그리기
    async function loadReactions() {
      const view = viewing;
      if (!view) return;

      let likes, comments, commentLikes;
      try {
        const results = await Promise.all([
          call("posts", { board: view.likeBoard }),
          call("posts", { board: view.commentBoard }),
          call("posts", { board: view.commentLikeBoard })
        ]);
        likes = results[0];
        comments = results[1];
        commentLikes = results[2];
      } catch (error) {
        if (error.message === "NOT_LOGGED_IN") leave();
        return;
      }
      if (viewing !== view) return; // 그사이 창을 닫았거나 다른 게시물을 열었으면 그만두기

      // 좋아요: 한 사람이 여러 번 눌러도 한 명으로 세요
      const like = readLikes(likes);
      myLikes = like.mine;
      likeButton.className = myLikes.length > 0 ? "like-button on" : "like-button";
      likeButton.textContent = myLikes.length > 0 ? "♥ 좋아요" : "♡ 좋아요";
      likeButton.disabled = false;
      likeCount.textContent = like.people > 0 ? like.people + "명이 좋아해요" : "";
      saveCounts(view.sk, likes, comments); // 목록의 숫자도 같이 고쳐요

      // 댓글: 바뀐 게 없으면 그대로 두기
      const ids = [comments, commentLikes].map(function (list) {
        return list.map(function (item) { return item.sk; }).join(",");
      }).join("|") + "|" + profilesKey;
      if (ids === shownComments) return;
      shownComments = ids;

      // 댓글마다 누가 좋아요를 눌렀는지 모으기 (글에 댓글 번호가 적혀 있어요)
      const byComment = {};
      commentLikes.forEach(function (item) {
        (byComment[item.text] = byComment[item.text] || []).push(item);
      });
      const likesOf = {};
      Object.keys(byComment).forEach(function (sk) { likesOf[sk] = readLikes(byComment[sk]); });

      const tree = readComments(comments);
      document.getElementById("commentTitle").textContent = tree.total > 0 ? "댓글 " + tree.total + "개" : "댓글";
      commentList.innerHTML = "";

      if (tree.tops.length === 0) {
        const none = document.createElement("p");
        none.className = "no-comment";
        none.textContent = "아직 댓글이 없어요.";
        commentList.appendChild(none);
      }

      tree.tops.forEach(function (comment) {
        commentList.appendChild(makeComment(view, comment, likesOf, false));
        if (comment.replies.length > 0) {
          const replies = document.createElement("div");
          replies.className = "replies";
          comment.replies.forEach(function (reply) {
            replies.appendChild(makeComment(view, reply, likesOf, true));
          });
          commentList.appendChild(replies);
        }
      });

      // 답글을 달던 댓글이 지워졌으면 그냥 댓글로 돌아가기
      if (replyTo && !tree.tops.some(function (comment) { return comment.sk === replyTo.sk; })) setReplyTo(null);
    }

    // 좋아요 누르기 / 한 번 더 누르면 취소
    likeButton.addEventListener("click", async function () {
      const view = viewing;
      if (!view) return;
      likeButton.disabled = true;
      viewError.textContent = "";
      try {
        if (myLikes.length > 0) {
          for (const sk of myLikes) await call("remove", { board: view.likeBoard, sk: sk });
        } else {
          await call("post", { board: view.likeBoard, text: "like" });
        }
      } catch (error) {
        viewError.textContent = errorText(error);
      }
      await loadReactions();
      if (viewing === view) likeButton.disabled = false;
    });

    // 댓글 좋아요 누르기 / 한 번 더 누르면 취소 (mine: 내가 이미 누른 좋아요 번호들)
    async function toggleCommentLike(view, commentSk, mine) {
      viewError.textContent = "";
      try {
        if (mine.length > 0) {
          for (const sk of mine) await call("remove", { board: view.commentLikeBoard, sk: sk });
        } else {
          await call("post", { board: view.commentLikeBoard, text: String(commentSk) });
        }
      } catch (error) {
        viewError.textContent = errorText(error);
      }
      shownComments = null; // 실패했어도 버튼을 다시 누를 수 있게 새로 그려요
      loadReactions();
    }

    // 댓글이나 답글 달기
    commentForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      const view = viewing;
      const text = commentInput.value.replace(/[\u0000-\u001f]/g, " ").trim();
      if (!view || !text) return;
      // 나쁜 말이 있으면 올리지 않아요
      if (hasBadWords(text)) { viewError.textContent = ERROR_TEXT.BAD_WORD; return; }

      commentButton.disabled = true;
      viewError.textContent = "";
      try {
        // 답글이면 어느 댓글의 답글인지 글 앞에 숨겨서 적어요
        const hidden = replyTo ? MARK + "r" + replyTo.sk + MARK : "";
        await call("post", { board: view.commentBoard, text: hidden + text });
        commentInput.value = "";
        setReplyTo(null);
      } catch (error) {
        viewError.textContent = errorText(error);
      }
      commentButton.disabled = false;
      loadReactions();
    });

    // 내 댓글 지우기
    async function deleteComment(view, sk) {
      if (!confirm("이 댓글을 삭제할까요?")) return;
      try {
        await call("remove", { board: view.commentBoard, sk: sk });
      } catch (error) {
        viewError.textContent = errorText(error);
      }
      loadReactions();
    }

    // 창 닫기: "닫기" 버튼, 창 바깥 어두운 곳, Esc 키
    document.getElementById("composeCloseButton").addEventListener("click", function () { composeDialog.close(); });
    document.getElementById("viewCloseButton").addEventListener("click", function () { viewDialog.close(); });
    document.getElementById("profileCloseButton").addEventListener("click", function () { profileDialog.close(); });
    [composeDialog, viewDialog, profileDialog].forEach(function (dialog) {
      dialog.addEventListener("click", function (event) {
        if (event.target === dialog) dialog.close();
      });
    });
    viewDialog.addEventListener("close", function () {
      if (!viewDialog.open) viewing = null; // 그사이 다른 게시물을 열었으면 그대로 둬요
    });

    // ───────── 내 프로필 바꾸기 ─────────
    const profileInput = document.getElementById("profileInput");
    const profilePreview = document.getElementById("profilePreview");
    const profileError = document.getElementById("profileError");
    const profileSaveButton = document.getElementById("profileSaveButton");
    let newProfile;         // 새로 고른 사진. 안 바꿨으면 undefined, "기본 그림으로"를 눌렀으면 null
    let previewUrl = null;  // 새로 고른 사진을 미리 보여 주는 주소

    // 미리보기 그리기
    function showProfilePreview() {
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = newProfile ? URL.createObjectURL(newProfile) : null;
      const url = newProfile === undefined ? undefined : previewUrl;
      profilePreview.innerHTML = "";
      profilePreview.appendChild(makeAvatar(me, "big", url));
    }

    profileButton.addEventListener("click", function () {
      newProfile = undefined;
      profileError.textContent = "";
      document.getElementById("profileName").textContent = me;
      showProfilePreview();
      profileDialog.showModal();
    });

    // 사진을 고르면 작게 줄여서 미리 보여 주기 (아직 저장은 안 해요)
    profileInput.addEventListener("change", async function () {
      const file = profileInput.files[0];
      profileInput.value = "";
      if (!file) return;
      profileError.textContent = "";
      try {
        if (!file.type.startsWith("image/")) throw new Error("BAD_FILE");
        newProfile = await shrinkPhoto(file, PROFILE_SIZE);
        showProfilePreview();
      } catch (error) {
        profileError.textContent = error.message === "BAD_FILE" ? ERROR_TEXT.BAD_FILE : "이 사진은 열 수 없어요.";
      }
    });

    document.getElementById("profileResetButton").addEventListener("click", function () {
      newProfile = null;
      profileError.textContent = "";
      showProfilePreview();
    });

    // "저장"을 누르면 서버에 올리기
    profileSaveButton.addEventListener("click", async function () {
      if (newProfile === undefined) { profileDialog.close(); return; } // 바꾼 게 없어요

      profileSaveButton.disabled = true;
      profileSaveButton.textContent = "저장하는 중...";
      profileError.textContent = "";
      try {
        if (newProfile) {
          const key = await uploadFile(newProfile);
          await call("post", { board: PROFILE_BOARD, text: "", media: [{ kind: "image", key: key }] });
        }
        // 예전 프로필 사진은 지우기 (새 사진을 올렸으면 가장 새것 하나만 남겨요)
        const mine = (await call("posts", { board: PROFILE_BOARD })).filter(function (item) {
          return item.author === me;
        });
        for (const item of mine.slice(newProfile ? 1 : 0)) {
          await call("remove", { board: PROFILE_BOARD, sk: item.sk });
        }
        profileDialog.close();
      } catch (error) {
        profileError.textContent = errorText(error);
        if (error.message === "NOT_LOGGED_IN") leave();
      }
      profileSaveButton.disabled = false;
      profileSaveButton.textContent = "저장";
      if (me) loadPhotos();
    });

    // ───────── 새 소식 물어보기 ─────────
    // 15초마다, 그리고 이 창으로 돌아왔을 때 새 게시물이 있는지 서버에 물어보기
    setInterval(function () { if (me && !document.hidden) loadPhotos(); }, 15000);
    document.addEventListener("visibilitychange", function () {
      if (me && !document.hidden) loadPhotos();
    });
    // 게시물을 크게 보고 있는 동안에는 5초마다 새 좋아요와 댓글이 있는지 물어보기
    setInterval(function () { if (me && viewDialog.open && !document.hidden) loadReactions(); }, 5000);
    // 화면에 보이는 게시물의 좋아요 수와 댓글 수는 30초마다 다시 물어보기
    setInterval(function () {
      if (me && !document.hidden) visiblePosts.forEach(askCounts);
    }, 30000);

    // ───────── 시작 ─────────
    async function start() {
      // 전에 로그인해 둔 적이 있으면 바로 들어가기 (메신저에서 로그인한 것도 돼요)
      if (token) {
        try {
          enter((await call("whoami")).id);
          return;
        } catch (error) {
          if (error.message === "NOT_LOGGED_IN") { token = null; localStorage.removeItem(TOKEN_KEY); }
        }
      }
      setMode(false);
      loginBox.hidden = false;

      // 가입 코드가 필요한 서버인지 물어보기
      try { needsCode = (await call("info")).needsCode; } catch (error) {}
      codeInput.hidden = !(signupMode && needsCode);
    }
    start();
  </script>
</body>
</html>
