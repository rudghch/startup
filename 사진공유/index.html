<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사진공유</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
      background: #fafafa;
      color: #1f2430;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: #ffffff;
      border-bottom: 1px solid #e1e5ee;
    }
    header h1 { margin: 0; font-size: 22px; }
    header a { color: #3b6cf6; font-size: 14px; }

    main { max-width: 900px; margin: 0 auto; padding: 20px 16px 40px; }

    /* 사진 올리기 버튼 */
    .upload-button {
      display: inline-block;
      padding: 12px 22px;
      font-size: 17px;
      font-weight: bold;
      border-radius: 12px;
      background: #e1306c;
      color: #ffffff;
      cursor: pointer;
    }
    .upload-button:hover { background: #c81f5a; }
    #photoInput:focus-visible + .upload-button { outline: 3px solid #1f2430; }
    /* 진짜 파일 선택 칸은 숨기고, 위의 버튼을 대신 눌러요 */
    #photoInput { position: absolute; width: 1px; height: 1px; opacity: 0; }

    .count { margin: 16px 0; color: #5b6272; font-size: 15px; }
    .empty { padding: 60px 0; text-align: center; color: #8a91a1; font-size: 17px; }

    /* 사진 목록 */
    .photo-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }
    .photo-card {
      background: #ffffff;
      border: 1px solid #e1e5ee;
      border-radius: 14px;
      overflow: hidden;
    }
    .photo-card img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
    }
    .photo-card .info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
    }
    .photo-card .date { font-size: 13px; color: #5b6272; }
    .photo-card button {
      padding: 6px 12px;
      font-size: 14px;
      font-family: inherit;
      border: 1px solid #e0b4b4;
      border-radius: 8px;
      background: #fff5f5;
      color: #c0392b;
      cursor: pointer;
    }
    .photo-card button:hover { background: #ffe3e3; }
  </style>
</head>
<body>
  <header>
    <h1>📷 사진공유</h1>
    <a href="../">처음 화면으로</a>
  </header>

  <main>
    <!-- 사진 올리기 -->
    <input type="file" id="photoInput" accept="image/*" multiple>
    <label for="photoInput" class="upload-button">＋ 사진 올리기</label>

    <p class="count" id="count"></p>

    <!-- 사진 목록이 그려지는 곳 -->
    <div class="photo-list" id="photoList"></div>
    <p class="empty" id="empty">아직 사진이 없어요. 첫 사진을 올려 보세요!</p>
  </main>

  <script>
    const photoInput = document.getElementById("photoInput");
    const photoList = document.getElementById("photoList");
    const empty = document.getElementById("empty");
    const count = document.getElementById("count");

    // 사진을 이 컴퓨터의 브라우저에 저장할 때 쓰는 이름
    const STORAGE_KEY = "photo-share-photos";

    // 사진이 너무 크면 저장이 안 되니까 이 크기로 줄여요
    const MAX_SIZE = 800;

    // 올린 사진들: { id, image, date } 가 차례로 들어 있어요
    let photos = loadPhotos();

    // 저장해 둔 사진 불러오기
    function loadPhotos() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch (error) {
        return [];
      }
    }

    // 이 브라우저에서 저장을 쓸 수 있는지 알아보기
    function canUseStorage() {
      try {
        localStorage.setItem(STORAGE_KEY + "-test", "1");
        localStorage.removeItem(STORAGE_KEY + "-test");
        return true;
      } catch (error) {
        return false;
      }
    }
    const storageWorks = canUseStorage();

    // 사진 저장하기 (저장 공간이 꽉 차면 false)
    function savePhotos() {
      // 저장을 쓸 수 없는 곳에서는 화면에만 보여 줘요 (새로고침하면 사라져요)
      if (!storageWorks) return true;

      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(photos));
        return true;
      } catch (error) {
        return false;
      }
    }

    // 사진 파일을 작게 줄여서 글자(데이터)로 바꾸기
    function shrinkPhoto(file) {
      return new Promise(function (resolve, reject) {
        const image = new Image();
        image.onload = function () {
          const scale = Math.min(1, MAX_SIZE / Math.max(image.width, image.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(image.width * scale);
          canvas.height = Math.round(image.height * scale);
          canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(image.src);
          resolve(canvas.toDataURL("image/jpeg", 0.8));
        };
        image.onerror = reject;
        image.src = URL.createObjectURL(file);
      });
    }

    // 화면에 사진 목록 그리기
    function showPhotos() {
      photoList.innerHTML = "";

      photos.forEach(function (photo) {
        const card = document.createElement("div");
        card.className = "photo-card";

        const image = document.createElement("img");
        image.src = photo.image;
        image.alt = "올린 사진";
        card.appendChild(image);

        const info = document.createElement("div");
        info.className = "info";

        const date = document.createElement("span");
        date.className = "date";
        date.textContent = photo.date;
        info.appendChild(date);

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.textContent = "삭제";
        deleteButton.addEventListener("click", function () {
          deletePhoto(photo.id);
        });
        info.appendChild(deleteButton);

        card.appendChild(info);
        photoList.appendChild(card);
      });

      empty.hidden = photos.length > 0;
      count.textContent = photos.length > 0 ? "사진 " + photos.length + "장" : "";
    }

    // 사진 올리기
    async function addPhotos(files) {
      for (const file of files) {
        if (!file.type.startsWith("image/")) continue; // 사진이 아니면 건너뛰기

        let image;
        try {
          image = await shrinkPhoto(file);
        } catch (error) {
          alert("이 사진은 열 수 없어요: " + file.name);
          continue;
        }

        // 새 사진을 맨 앞에 넣어요
        photos.unshift({
          id: Date.now() + "-" + Math.random().toString(16).slice(2),
          image: image,
          date: new Date().toLocaleDateString("ko-KR")
        });

        if (!savePhotos()) {
          photos.shift(); // 저장하지 못한 사진은 다시 빼요
          alert("저장 공간이 꽉 찼어요. 사진을 몇 장 지우고 다시 올려 주세요.");
          break;
        }
      }
      showPhotos();
    }

    // 사진 삭제하기
    function deletePhoto(id) {
      if (!confirm("이 사진을 삭제할까요?")) return;

      photos = photos.filter(function (photo) {
        return photo.id !== id;
      });
      savePhotos();
      showPhotos();
    }

    // 사진을 고르면 올리기
    photoInput.addEventListener("change", function () {
      addPhotos(Array.from(photoInput.files));
      photoInput.value = ""; // 같은 사진을 또 고를 수 있게 비워요
    });

    showPhotos();
  </script>
</body>
</html>
