<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>6학년 스타트업</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 40px 16px;
      font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
      background: #f4f6fb;
      color: #1f2430;
    }
    main { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 32px; margin: 0 0 8px; }
    p.intro { margin: 0 0 32px; color: #5b6272; font-size: 18px; }
    a.card {
      display: block;
      padding: 24px;
      margin-bottom: 16px;
      border-radius: 16px;
      background: #ffffff;
      border: 2px solid #e1e5ee;
      color: inherit;
      text-decoration: none;
    }
    a.card:hover, a.card:focus { border-color: #3b6cf6; }
    a.card h2 { margin: 0 0 6px; font-size: 24px; }
    a.card p { margin: 0; color: #5b6272; font-size: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>6학년 스타트업</h1>
    <p class="intro">우리가 직접 만든 서비스예요. 눌러서 써 보세요!</p>

    <a class="card" href="길찾기/">
      <h2>🗺️ 길찾기</h2>
      <p>지도에서 가는 길을 찾아 주는 서비스</p>
    </a>

    <a class="card" href="메신저/">
      <h2>💬 메신저</h2>
      <p>친구와 이야기를 나누는 서비스</p>
    </a>

    <a class="card" href="사진공유/">
      <h2><img src="사진공유/logo.png" alt="잉스타 로고" style="width: 28px; height: 28px; vertical-align: -4px;"> 잉스타</h2>
      <p>사진을 올리고 함께 보는 서비스</p>
    </a>
  </main>
</body>
</html>
